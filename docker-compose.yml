# Local topology (ADR-0013/0015): the same three containers run on the dev EC2 node.
# `docker compose up -d` starts infra (Redpanda + Postgres); the app runs via
# `./gradlew :app:bootRun` during development, or as a container with
# `docker compose --profile app up --build`.
services:
  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      # 512M is ample for our low-rate topics and starts reliably on boards where
      # seastar can't read the cgroup memory limit and under-detects available RAM
      # (e.g. Raspberry Pi OS with the memory cgroup controller off) — a 1G request
      # failed there with "insufficient physical memory". Fine on CI/EC2 too.
      - --memory=512M
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
      - --schema-registry-addr=0.0.0.0:8081
    ports:
      - "9092:9092"   # Kafka API
      - "8081:8081"   # built-in schema registry (ADR-0012)
      - "9644:9644"   # admin
    volumes:
      - redpanda-data:/var/lib/redpanda/data   # persist topics/offsets across restarts
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jethro
      POSTGRES_USER: jethro
      POSTGRES_PASSWORD: jethro   # dev only; real secrets via SSM (ADR-0013)
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data   # persist the DB across restarts (books, fills, orders…)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jethro -d jethro"]
      interval: 10s
      timeout: 5s
      retries: 6

  ollama:
    # Pinned: an unpinned :latest is re-pulled fresh by every CI run, so an upstream image
    # regression breaks CI with no code change (2026-07-14: the just-published image's
    # llama-server segfaulted on model load on some runners → FullStackIT commentary
    # timeout). Bump deliberately: change the tag, watch CI go green, commit.
    image: ollama/ollama:0.31.2
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    # first run: docker exec jethro-ollama-1 ollama pull qwen2.5:3b

  app:
    profiles: ["app"]
    build: .
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      POSTGRES_URL: jdbc:postgresql://postgres:5432/jethro
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  ollama-models:
  pg-data:
  redpanda-data:
