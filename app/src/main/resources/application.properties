# trading-core wiring (ADR-0014/0015) — sim feed by default: local dev never
# depends on a real provider or market hours (ADR-0009).
jethro.trading.enabled=true
# Market-data provider: "yahoo" (ADR-0023: free, ~15-min delayed, unofficial/ToS-limited,
# DEV/DEMO ONLY — never production or real-money) or "sim" (seedable/offline). Default is yahoo
# so the running app shows real prices; CI/tests force sim via the build (system property), so
# they never hit the network. Yahoo covers price-quoted names (equities/index futures/FX);
# rates/swaps stay on the curve sim. Set to sim here or PROVIDER=sim ./scripts/run-local.sh to run offline.
jethro.trading.provider=yahoo
# Gap between individual Yahoo requests (ms). Yahoo 429s bursts, so we trickle: one symbol,
# wait, next. Each symbol refreshes every ~spacing × instrumentCount (≈9s for 13 names at 700ms).
# Lower = fresher but more throttling risk; raise if you see drops. PROVIDER=sim to avoid Yahoo.
jethro.trading.yahoo-request-spacing-millis=1000
# Finnhub (ADR-0024): real-time US equities over WebSocket — no rate-limit-on-polling, fresh
# marks. Free key at finnhub.io. Set via env: FINNHUB=xxxx PROVIDER=finnhub ./scripts/run-local.sh
# Blank → falls back to sim. Covers AAPL/MSFT/AMZN/GOOG; futures/FX/curve stay on the sim.
jethro.trading.finnhub-token=${FINNHUB_TOKEN:}
# Real US Treasury yield curve via Finnhub (ADR-0024): when a token is set, the whole rates
# stack (DV01, swap PV, rate scenarios, the Rates-page curve) reprices on LIVE levels instead
# of the factor sim. Probed once at startup; a gated/failed probe falls back to the sim, logged.
# NOTE: Finnhub bond data may be premium — check the log line "RATES CURVE:" on the host.
jethro.trading.real-curve=true
jethro.trading.treasury-curve-refresh-seconds=120
# Shared cap on ALL Finnhub REST calls/minute (news + curve). Free tier is 60/min account-wide
# (WS trades exempt); 55 leaves headroom. One limiter guards every REST client.
jethro.trading.finnhub-max-calls-per-minute=55
# Top-bar market indicators (ADR-0023): major indices/ETFs (US + international) shown for
# context only — display, never tradeable. Real (delayed) values from Yahoo; CI/tests force
# this off. Symbols are a curated default set; override jethro.indicators.symbols to customise.
jethro.indicators.enabled=true
# Poll cadence: indices are delayed and slow, and Yahoo rate-limits bursts, so poll gently
# every 5 min; requests within a poll are also spaced out (see IndicatorsService) to avoid 429s.
jethro.indicators.poll-seconds=300
jethro.trading.sim-seed=42
jethro.trading.sim-instruments=AAPL,MSFT,AMZN,GOOG,SAP,JNJ,NVDA,JPM,ES,NQ,EURUSD,GBPUSD,AUDUSD,ZN,ZT,ZF,ZB
# Sim engine (ADR-0026): "correlated" (default) = cross-asset factor model — one joint draw per
# tick moves equities, FX and the curve in concert, with regime switching (incl. RISK_OFF and
# INFLATION_SHOCK) and fat (Student-t) tails, calibrated by sim-calibration.json (hand-curated
# from long-run market stats). "legacy" = old independent walks.
jethro.trading.sim-engine=correlated
# Time compression: wall seconds per simulated trading day. DEFAULT 23400 = a 6.5h trading day at
# REAL TIME (1×): measured ≈0.34bp/tick, ≈1bp/sec, ≈5bp/min σ for MSFT — a realistic steady tape
# whose only big moves are the ones you inject from the mixer. The old 120 (a day in 2 minutes,
# 195× fast-forward) made a statistically-correct tape unwatchable: ≈14× the per-wall-minute
# movement of a real screen PLUS an ~82bp overnight gap every 2 wall-minutes (day boundary).
# Set 120 for fast day-cycling (EOD/VaR/backtest-style runs accumulate "days" quickly).
# The session calendar (ADR-0027) follows this on pure sim runs: a trading DAY closes every
# 120 wall seconds — daily closes, firm/book equity and day-P&L attribution are frozen at each
# boundary, working DAY orders expire, the sim gaps close->open (one correlated jump carrying
# ~30% of a day's variance), and VaR accrues its 60-day window in ~2 wall hours. Real providers
# (yahoo/finnhub) use wall-clock dates in session-zone instead.
jethro.trading.sim-seconds-per-day=23400
# Session calendar for LIVE feeds (ADR-0027): the trading day rolls at session-roll-hour
# (17 = the CME 17:00-ET futures settlement boundary) in session-zone, and weekends/US
# full-closure holidays (NYSE set, observance-shifted; Good Friday included) never own a
# session — Friday 17:30 belongs to MONDAY. Early-close half days count as full sessions
# (disclosed). Pure sim runs use the compressed tape-synchronized calendar instead.
jethro.trading.session-zone=America/New_York
jethro.trading.session-roll-hour=17
# Corporate-action / bad-print guard: a mark that jumps more than this (bps of the previous
# mark, per asset class) in ONE update QUARANTINES the instrument — the suspect price never
# reaches P&L/orders/sizing/history, an ALERT card fires, and an operator accepts the new
# level with POST /api/marks/{id}/clear-quarantine. A 2:1 split (-50%) must never be read as
# a crash. Ordinary dividends (~0.5-2%) are below any sane threshold — detecting those needs
# a real corporate-action feed (tracked follow-up). Defaults: EQUITY/DEFAULT 2000 (20%),
# FUTURE/SWAP 1000, FX/BOND 800; override per class here, 0 disables a class:
# jethro.trading.mark-jump-bps.EQUITY=2000
# jethro.trading.sim-calibration-path=/path/to/custom-calibration.json
jethro.trading.sim-start-price=100.00
# Illustrative per-instrument start levels so multi-asset prices/PnL look realistic
# (still a random walk, ADR-0009 — not a real feed). Treasury futures and swap par
# rates are NOT walked independently: sim-curve prices them from the SOFR factor curve.
jethro.trading.sim-start-prices.AAPL=190.00
jethro.trading.sim-start-prices.MSFT=430.00
jethro.trading.sim-start-prices.AMZN=185.00
jethro.trading.sim-start-prices.GOOG=175.00
jethro.trading.sim-start-prices.SAP=185.00
jethro.trading.sim-start-prices.JNJ=155.00
jethro.trading.sim-start-prices.NVDA=125.00
jethro.trading.sim-start-prices.JPM=205.00
jethro.trading.sim-start-prices.ES=5450.00
jethro.trading.sim-start-prices.NQ=19800.00
jethro.trading.sim-start-prices.EURUSD=1.085000
jethro.trading.sim-start-prices.GBPUSD=1.270000
jethro.trading.sim-start-prices.AUDUSD=0.660000
jethro.trading.sim-start-prices.ZN=110.50
jethro.trading.sim-start-prices.ZT=102.90
jethro.trading.sim-start-prices.ZF=107.30
jethro.trading.sim-start-prices.ZB=118.20
# Annualized volatility per instrument — calibrates the walk's per-tick step so moves
# are realistic (a stock can't jump 3% in 5 minutes anymore). Statistical params, not money.
jethro.trading.sim-annual-vol=0.20
jethro.trading.sim-annual-vols.AAPL=0.28
jethro.trading.sim-annual-vols.MSFT=0.24
jethro.trading.sim-annual-vols.AMZN=0.32
jethro.trading.sim-annual-vols.GOOG=0.28
jethro.trading.sim-annual-vols.SAP=0.25
jethro.trading.sim-annual-vols.JNJ=0.16
jethro.trading.sim-annual-vols.NVDA=0.45
jethro.trading.sim-annual-vols.JPM=0.26
jethro.trading.sim-annual-vols.ES=0.15
jethro.trading.sim-annual-vols.NQ=0.20
jethro.trading.sim-annual-vols.EURUSD=0.08
jethro.trading.sim-annual-vols.GBPUSD=0.09
jethro.trading.sim-annual-vols.ZN=0.05
jethro.trading.sim-annual-vols.ZT=0.02
jethro.trading.sim-annual-vols.ZF=0.04
jethro.trading.sim-annual-vols.ZB=0.10
jethro.trading.sim-tick-interval-millis=100
jethro.trading.lmdb-path=data/trading-core
jethro.trading.lmdb-max-size-mb=256
jethro.trading.buffer-capacity=4096

# Hedging advisor (ADR-0038/0039). Firm-level equity beta-hedge onto an index future, v1.
# mode: OFF | ADVISE (surface proposals) | AUTO (auto-submit — execution wiring is a follow-up).
# The book is held TARGET-FLAT: any net single-name equity is hedged back to flat (no cap band).
# equity-rebalance-floor-usd: a small anti-churn floor only — |net| at or below it is treated as
# flat so a trivial residual isn't re-hedged every cycle; 0 = always hedge to flat.
# effectiveness-floor: below this ρ² the advisor says "reduce, don't hedge" (weak proxy).
jethro.hedge.mode=AUTO
jethro.hedge.equity-rebalance-floor-usd=0
# min-trade-notional-usd: a hedge DELTA below this is not worth its spread/impact — source:
# ADR-0039 Decision 2 (the $10k churn guard). The proposal is target − held (never the full
# hedge re-sent — 2026-07-18 math review P1-1).
jethro.hedge.min-trade-notional-usd=10000
jethro.hedge.effectiveness-floor=0.25
# min-covariance-days: the STATISTICAL tier needs this many observed days before its beta/rho^2
# size real money — source: ADR-0041 (20-day sample-cov seed + 20 EWMA steps; RiskMetrics puts
# lambda=0.94's effective memory at ~74d). Below it the STRUCTURAL tier carries the book.
jethro.hedge.min-covariance-days=40
# Proxy selection (ADR-0042): candidates evaluated each cycle — tradable (live price, not
# quarantined), highest measured rho^2 wins; a held proxy is kept unless the challenger beats it
# by proxy-switch-margin (0.10 = PLACEHOLDER, Oleg to set from realized rho^2 noise — every
# switch pays two spreads). equity-proxy stays the STRUCTURAL tier's instrument (assigned betas
# are quoted against it).
jethro.hedge.equity-proxy-candidates=ES,NQ
jethro.hedge.proxy-switch-margin=0.10
jethro.hedge.equity-proxy=ES
jethro.hedge.equity-proxy-multiplier=50
# Hedge orders trade in their own dedicated book: its proxy position is the advisor's held-hedge
# feedback, and it never collides with the strategy's futures (which route to MACRO). Clean
# strategy-vs-hedge P&L attribution per ADR-0039.
jethro.hedge.book=HEDGE

# local SLM tier (ADR-0016): Ollama in compose; narrates, never computes numbers
jethro.ai.enabled=true
jethro.ai.base-url=http://localhost:11434
# Default to a small model that fits a Pi (frees ~1.5GB + CPU vs 3b — keeps the box out of swap,
# which was dropping the Ollama connection). Use qwen2.5:3b on an 8GB+ box with headroom.
jethro.ai.model=qwen2.5:1.5b
jethro.ai.interval-seconds=60
jethro.ai.max-output-tokens=200
# On a Pi, qwen2.5:3b inference measured ~60-70s/call (prompt eval dominates, ~1-2 tok/s), so a
# low timeout would kill valid generations mid-flight and show as "ollama unreachable". 180s
# leaves headroom (incl. the slow FIRST call that loads the model into memory). Watch the Ops page:
# if p95 latency creeps toward this, use a smaller model (e.g. qwen2.5:1.5b / llama3.2:1b) or a
# GPU box rather than raising it further. See the Ops (Ollama load) page for live latency/tok-s.
jethro.ai.request-timeout-seconds=180

# broker + ui (ADR-0012/0015/0017)
server.port=8080
jethro.kafka.enabled=true
jethro.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Mark is "stale" (feed went quiet) after this long WITHOUT a new update — measured against
# local receive time, not the provider's (possibly delayed) timestamp. Must exceed the feed's
# update interval: 45s covers the Yahoo 15s poll (3 missed polls) and the 100ms sim tick.
jethro.ui.stale-after-millis=45000
# recent price history per instrument for the interactive chart (hours). Durable in LMDB
# (ADR-0014, derived data) so a long window survives a restart and reads fast — the chart
# offers up to 12h, so retention matches. Durable long-term history is the S3 Parquet
# archive (ADR-0014), a separate concern.
jethro.ui.history-hours=12
# LMDB store for the chart history. Own subdir so one data volume covers it + trading-core.
jethro.ui.history-path=data/ui-history
jethro.ui.history-max-size-mb=256
# md.marks boot replay only refreshes the current-price snapshot (history is durable in LMDB),
# so a short window keeps boot fast — this app is the sole mark producer, nothing to backfill.
jethro.ui.replay-window-minutes=30
# A disconnected SSE client (browser tab closed/refreshed) makes Tomcat log a benign
# broken-pipe write as ERROR. The app handles it (drops the client) — keep the noise out.
logging.level.org.apache.catalina.core.ContainerBase.[Tomcat].[localhost].[/].[dispatcherServlet]=OFF

# toy momentum strategy (step 8 / ADR-0018): proposes advisory suggestions onto the
# attention feed, sized to target notional and gated by the pre-trade guardrail; never
# auto-routes. A stand-in until the frontier tier (ADR-0010) arrives.
jethro.strategy.enabled=true
jethro.strategy.interval-seconds=5
# Vol-adaptive signal: fires when the ~2-minute window move exceeds threshold-sigmas ×
# the instrument's OWN realized vol (a fixed bps bar can't fit equities and Treasuries
# at once — it either fires on noise or never). min-signal-bps floors out dust moves.
# Still no edge on a random-walk sim — mechanism demo, not alpha.
# Signal algo: "momentum" (default) or "mean-reversion" — the SAME z-score detector read in
# opposite directions (fade the extreme instead of chasing it). Both run through identical
# guardrails, vol-targeted sizing, execution costs and the multi-seed OOS harness — compare
# them honestly on /backtest.html (algo selector) or /api/backtest?algo=mean-reversion.
# mean-reversion is the default: the 2026-07-19 post-mortem showed momentum bleeds on this
# mean-reverting sim tape (ALPHA −$1,494, every name losing — it buys the breakout and the tape
# reverts). Per-instrument momentum-vs-mean-reversion OOS selection is the durable fix (its own
# ADR); this flip is the immediate, reversible stop-the-bleed, validated on /backtest.html.
jethro.strategy.algo=mean-reversion
# Per-instrument strategy selection (ADR-0043): the OOS harness measures momentum vs
# mean-reversion per instrument and the live strategy trades the winner (nothing where neither
# has a positive median edge). `algo` above is only the fallback until the first measurement.
# seed-count 9 = odd majority (ADR-0027 median gate); ticks/interval bound the background cost.
jethro.strategy.selection.enabled=true
jethro.strategy.selection.seed-count=9
jethro.strategy.selection.ticks=8000
jethro.strategy.selection.interval-minutes=60
jethro.strategy.lookback=24
# Churn dials (post-mortem F4: ~39% of the loss was transaction cost). Grounded in the EQUITY
# round-trip cost ≈ 7bp (5bp full spread + 2bp fee, both crossed on entry AND exit):
# - threshold-sigmas 3.0: fade only REAL ≥3σ extremes (the mean-reversion convention), not 2.5σ
#   noise — fewer, higher-conviction trades.
# - min-signal-bps 15 ≈ 2× the ~7bp round-trip: never fade a window dislocation too small for the
#   expected reversion to clear its own trading cost.
# STARTING values to cut churn; the OOS harness + TCA sheet calibrate the finals, not a decree.
jethro.strategy.threshold-sigmas=3.0
jethro.strategy.min-signal-bps=15
jethro.strategy.target-notional=25000
# Vol-TARGETED sizing (primary once daily history accrues — ~10 sim days ≈ 20 min at
# 120s/day): order notional = risk-budget-daily / σ_daily, where σ is the EWMA (λ=0.94)
# of recorded daily-close returns — the SAME history VaR uses. Capped per class. Worked:
# $250/day ÷ 1.8%/day (AAPL) = $13,889; ÷ 0.40%/day (ZN) = $62,500 — every position
# carries a comparable daily P&L swing. The AI sleeve sizes with the same formula.
# Until measured: strategy falls back to target-notional × signal-vol scale; AI to
# target-notional flat. 250 ≈ 25k × 1%/day, matching the old typical-equity size.
jethro.strategy.risk-budget-daily=250
# Position-aware participation (quant-engine phase 5): once a book holds 3x target
# notional in an instrument, same-direction signals are skipped; reducing ones pass.
jethro.strategy.max-position-notional=75000
# Per-class order cap: one Treasury futures contract (~$107-118k) is a normal rates
# order; ZT ($206k) stays unsizeable. Bond futures now participate in order-picking —
# and their sim prices derive FROM the curve (duration model), so it's coherent.
jethro.strategy.max-order-notional-by-class.BOND=150000
# One swap lot = $1M notional quoted as par-rate% × DV01-based multiplier (V9): the
# "order notional" the sizer sees is rate × multiplier ≈ $180k (5Y) / $330k (10Y) — a
# rate-times-DV01 risk figure, not face. Cap admits the 5Y lot; 10Y stays unsizeable.
jethro.strategy.max-order-notional-by-class.SWAP=250000
# Route auto-orders to the book that fits the instrument's asset class, instead of piling
# everything into one book (which caps fast). `book` is the fallback for unmapped classes.
jethro.strategy.book=ALPHA
jethro.strategy.book-by-class.EQUITY=ALPHA
jethro.strategy.book-by-class.FUTURE=MACRO
jethro.strategy.book-by-class.FX=MACRO
jethro.strategy.book-by-class.BOND=MACRO
jethro.strategy.book-by-class.SWAP=MACRO
# Auto-execute admissible signals as SIMULATED orders (ADR-0019). OFF by default; must
# never be enabled against a real broker. Cooldown throttles per-instrument submissions.
# Raised 60→300s (post-mortem F4): a 60s re-entry churned ES 32× in one session; a 5-min
# per-instrument cooldown lets a reversion play out before re-trading the same name.
jethro.strategy.auto-execute=true
jethro.strategy.auto-cooldown-seconds=300
# Long-only by default: a SELL signal may only REDUCE an existing long, never open or
# extend a short. Set true to let the strategy take shorts (macro books may want this).
jethro.strategy.allow-short=true
# The risk-reducing half of the loop (ADR-0019): without exits a losing position rides
# forever and a floored book just re-alarms. Per-position stop-loss / take-profit as a
# fraction of entry (0.008 = 0.8%); book de-risk flattens a managed book once its total
# loss reaches its configured max-loss cap. All submit SIMULATED risk-reducing orders.
jethro.strategy.stop-loss-pct=0.008
jethro.strategy.take-profit-pct=0.016
jethro.strategy.derisk-on-loss-cap=true
# Regime-aware sizing (quant-engine phase 5): scale NEW-entry notional in the sim's VOLATILE
# regime (risk-off in turbulence). 0.5 = half size; 0 = stand aside; 1 = no scaling. Exits and
# de-risking are never scaled — you can always reduce. The backtest mirrors this so its
# measured PnL reflects the same behaviour.
jethro.strategy.regime-volatile-scale=0.5

# LLM hypothesis layer (ADR-0022): the local SLM synthesises marks + a narrative sim feed
# + the portfolio into structured, NUMBER-FREE theses; the deterministic quant layer sizes
# and pre-trade-gates each; admissible ones surface on the attention feed for human review,
# and bounded autonomy (below) may auto-execute inside its deterministic envelope.
# Sizing reuses jethro.strategy.* (target notional, per-class caps, book routing).
jethro.hypothesis.enabled=true
# The AI sleeve trades its OWN book, separate from the momentum strategy's ALPHA/MACRO, so the
# two engines never flatten each other's positions (the algo was undoing AI trades → cost bleed).
jethro.hypothesis.book=AI
# Cadence: this is the delay AFTER each cycle finishes before the next starts (fixed-delay, so
# cycles never overlap/backlog). One cycle is dominated by the local SLM inference — watch the
# "hypotheses: … took Nms" log line to see how long yours takes on the box. Effective spacing ≈
# interval + inference time. 20s is fine; below the inference time it just runs back-to-back.
# NOTE: news only refreshes every narrative-refresh-seconds (60s, shared Finnhub budget), so
# running much faster than that re-reasons over the same headlines (prices still move, though).
jethro.hypothesis.interval-seconds=20
jethro.hypothesis.max-per-cycle=3
jethro.hypothesis.max-output-tokens=400
# Narrative (news) feed for the model. With a Finnhub token set (jethro.trading.finnhub-token)
# this is REAL news — general market + per-company headlines (ADR-0024), independent of the
# price provider. Without a token (e.g. CI) it's the seedable sim feed below, whose headlines
# correlate with the sim's market regime so the story matches the price action. Deterministic.
jethro.hypothesis.narrative-seed=42
# Min seconds between real-news refreshes — caps free-tier API calls independent of the
# hypothesis cadence. Ignored by the sim feed.
jethro.hypothesis.narrative-refresh-seconds=60
# Each thesis is annotated with a multi-seed OOS backtest of the MOMENTUM strategy on its
# instrument (ADR-0027). ADVISORY ONLY — it measures a different strategy's edge, so it does
# NOT gate autonomy (it used to, which silently revoked all AI trading once honest execution
# costs landed). Ticks of sim tape replayed per seed per cycle. Cheap.
jethro.hypothesis.backtest-ticks=15000
# Bounded autonomy (ADR-0022, amended by ADR-0027): OFF by default. When enabled, a thesis
# that is admissible, conviction ≥ min, and whitelisted (empty = all) auto-submits a SIMULATED
# order (ADR-0019) — SIZED by the AI's own MEASURED track record (scored outcomes at horizon
# expiry, ADR-0027):
#   PROBATION — fewer than min-track-record scored outcomes: orders resized down to
#               probation-order-notional so the record builds at small size.
#   EARNED    — full record AND measured outcome P&L > 0: full size up to max-order-notional
#               (over-cap rejected, never resized — full size must be deliberate).
#   REVOKED   — full record with non-positive P&L: no auto-execution, human review only.
# The model never widens this — it is operator config. NEVER a real broker.
# enabled is turned on at run time by AUTONOMY=on ./scripts/run-local.sh (kept false here so
# CI/tests never auto-trade). MEDIUM lets the small model's typical conviction through.
jethro.hypothesis.autonomy.enabled=false
jethro.hypothesis.autonomy.min-conviction=MEDIUM
jethro.hypothesis.autonomy.max-order-notional=30000
jethro.hypothesis.autonomy.cooldown-seconds=300
# Probation order size while the track record builds (default: max-order-notional / 4).
jethro.hypothesis.autonomy.probation-order-notional=7500
# Scored outcomes required before autonomy is judged on (and sized by) its record.
jethro.hypothesis.autonomy.min-track-record=10
# jethro.hypothesis.autonomy.whitelist=AAPL,MSFT   # optional; empty = all price-quoted names

# Execution model (ADR-0025): per-class spreads/fees default in code (EQUITY 5+1bp,
# FUTURE/BOND 1+0.2, FX 1+0, SWAP 0.4bp additive) — override via jethro.execution.spread-bps.*
# / fee-bps.*. Market impact: MARKET fills additionally pay the square-root law
# sigma_daily x sqrt(notional/ADV) when the instrument has an adv_usd attribute (refdata V19)
# AND measured daily vol; the participation cap below rejects orders over that fraction of
# ADV outright (0 disables). Both unmodelled -> spread+fee only, disclosed.
jethro.execution.max-adv-participation=0.02

# Walk-forward replay on REAL daily bars (ADR-0027): generate the bars file on a networked
# host with `python3 scripts/fetch_bars.py` (Stooq, ~6y daily closes; ES/NQ use index
# proxies, stated), then GET /api/backtest/walkforward (or the Backtest page). Parameters
# are chosen per fold on the FIT window only and measured on the UNSEEN eval window.
jethro.backtest.bars-path=data/historical-bars.json

# risk limits (ADR-0017 deterministic floor / ADR-0018 guardrail): per-book caps with
# per-book overrides, a per-instrument concentration cap, and firm-wide aggregate caps.
# Loss caps are ENFORCED pre-trade: a book past max-loss may only reduce risk. WARN at
# warn-ratio of a cap, ALERT at/over it. Demo values — tune to real risk appetite.
jethro.risk.max-gross-exposure=500000
jethro.risk.max-net-exposure=300000
jethro.risk.max-loss-pnl=25000
jethro.risk.max-instrument-exposure=200000
jethro.risk.warn-ratio=0.80
# Firm circuit breaker (ADR-0027): at this drawdown from the PEAK firm total P&L, ALL
# auto-execution halts (strategy entries + AI autonomy; risk-reducing exits and manual orders
# stay allowed) until an operator resets: POST /api/breaker/reset. Remove/0 to disable.
jethro.risk.max-firm-drawdown=50000
# MACRO limits sized for the swap GROSS-NOTIONAL exposure convention (V22): one swap lot
# now counts as $1M of exposure (it is $1M of notional), so the caps leave room for a
# couple of lots alongside the futures book. DV01 remains the real rates-risk measure.
jethro.risk.books.MACRO.max-gross-exposure=3000000
jethro.risk.books.MACRO.max-net-exposure=2000000
jethro.risk.books.MACRO.max-loss-pnl=50000
jethro.risk.books.MACRO.max-instrument-exposure=1500000
# HEDGE book (ADR-0039/0040): dedicated book for hedge orders only. Caps sized to COVER the
# equity books it hedges — target hedge notional ≈ β̂ (≈1.8 measured in sim) × the equity
# gross the base caps allow, so the MACRO numbers are mirrored rather than invented anew.
# A cap here that is too small silently blocks the hedge — the guardrail rejects the order.
jethro.risk.books.HEDGE.max-gross-exposure=3000000
jethro.risk.books.HEDGE.max-net-exposure=2000000
jethro.risk.books.HEDGE.max-loss-pnl=50000
jethro.risk.books.HEDGE.max-instrument-exposure=3000000
jethro.risk.firm.max-gross-exposure=1500000
jethro.risk.firm.max-net-exposure=1000000
jethro.risk.firm.max-loss-pnl=75000

# reference data (ADR-0005/0008): manual DataSource+Flyway wiring (see RefDataConfig)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
jethro.persistence.enabled=true
jethro.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/jethro}
jethro.datasource.username=${POSTGRES_USER:jethro}
jethro.datasource.password=${POSTGRES_PASSWORD:jethro}

# Correlated market regimes on the sim (calm/trend/volatile/shock episodes) so trends,
# vol spikes and limit alarms actually happen — same seed, same regime path (ADR-0009).
# STEADY BASELINE (the sim's purpose: a calm, realistic tape you shape with the mixer, not one
# that spontaneously lurches 100bp/sec). Auto-regime vol spikes and auto-news are OFF by default —
# the mixer (per-instrument vol/drift faders) and the manual ⚡ news button are how you inject moves
# and watch the model react. Set sim-regimes=true / sim-news-per-day>0 to let the tape move itself.
jethro.trading.sim-regimes=false
jethro.trading.sim-news-per-day=0
