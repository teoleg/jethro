# trading-core wiring (ADR-0014/0015) — sim feed by default: local dev never
# depends on a real provider or market hours (ADR-0009).
jethro.trading.enabled=true
# Market-data provider: "yahoo" (ADR-0023: free, ~15-min delayed, unofficial/ToS-limited,
# DEV/DEMO ONLY — never production or real-money) or "sim" (seedable/offline). Default is yahoo
# so the running app shows real prices; CI/tests force sim via the build (system property), so
# they never hit the network. Yahoo covers price-quoted names (equities/index futures/FX);
# rates/swaps stay on the curve sim. Set to sim here or PROVIDER=sim ./scripts/run-local.sh to run offline.
jethro.trading.provider=yahoo
# Gap between individual Yahoo requests (ms). Yahoo 429s bursts, so we trickle: one symbol,
# wait, next. Each symbol refreshes every ~spacing × instrumentCount (≈9s for 13 names at 700ms).
# Lower = fresher but more throttling risk; raise if you see drops. PROVIDER=sim to avoid Yahoo.
jethro.trading.yahoo-request-spacing-millis=1000
# Finnhub (ADR-0024): real-time US equities over WebSocket — no rate-limit-on-polling, fresh
# marks. Free key at finnhub.io. Set via env: FINNHUB=xxxx PROVIDER=finnhub ./scripts/run-local.sh
# Blank → falls back to sim. Covers AAPL/MSFT/AMZN/GOOG; futures/FX/curve stay on the sim.
jethro.trading.finnhub-token=${FINNHUB_TOKEN:}
# Alpaca (ADR-0056): genuinely-free (no credit card) real-time US equities over WebSocket, IEX tier.
# Better in-hours coverage than Finnhub for the same names; a delayed Yahoo fallback covers the gaps
# (the freshness guard keeps the two from mixing). Set via env:
#   ALPACA_KEY_ID=xxx ALPACA_SECRET=yyy PROVIDER=alpaca ./scripts/run-local.sh
# Either blank → falls back to sim. Free IEX = IEX-routed prints only (thin on illiquid names).
jethro.trading.alpaca-key-id=${ALPACA_KEY_ID:}
jethro.trading.alpaca-secret=${ALPACA_SECRET:}
# Real US Treasury yield curve via Finnhub (ADR-0024): when a token is set, the whole rates
# stack (DV01, swap PV, rate scenarios, the Rates-page curve) reprices on LIVE levels instead
# of the factor sim. Probed once at startup; a gated/failed probe falls back to the sim, logged.
# NOTE: Finnhub bond data may be premium — check the log line "RATES CURVE:" on the host.
jethro.trading.real-curve=true
jethro.trading.treasury-curve-refresh-seconds=120
# Shared cap on ALL Finnhub REST calls/minute (news + curve). Free tier is 60/min account-wide
# (WS trades exempt); 55 leaves headroom. One limiter guards every REST client.
jethro.trading.finnhub-max-calls-per-minute=55
# Top-bar market indicators (ADR-0023): major indices/ETFs (US + international) shown for
# context only — display, never tradeable. Real (delayed) values from Yahoo; CI/tests force
# this off. Symbols are a curated default set; override jethro.indicators.symbols to customise.
jethro.indicators.enabled=true
# Poll cadence: indices are delayed and slow, and Yahoo rate-limits bursts, so poll gently
# every 5 min; requests within a poll are also spaced out (see IndicatorsService) to avoid 429s.
jethro.indicators.poll-seconds=300
jethro.trading.sim-seed=42
jethro.trading.sim-instruments=AAPL,MSFT,AMZN,GOOG,SAP,JNJ,NVDA,JPM,ES,NQ,EURUSD,GBPUSD,AUDUSD,ZN,ZT,ZF,ZB
# Sim engine (ADR-0026): "correlated" (default) = cross-asset factor model — one joint draw per
# tick moves equities, FX and the curve in concert, with regime switching (incl. RISK_OFF and
# INFLATION_SHOCK) and fat (Student-t) tails, calibrated by sim-calibration.json (hand-curated
# from long-run market stats). "legacy" = old independent walks.
jethro.trading.sim-engine=correlated
# Time compression: wall seconds per simulated trading day. DEFAULT 23400 = a 6.5h trading day at
# REAL TIME (1×): measured ≈0.34bp/tick, ≈1bp/sec, ≈5bp/min σ for MSFT — a realistic steady tape
# whose only big moves are the ones you inject from the mixer. The old 120 (a day in 2 minutes,
# 195× fast-forward) made a statistically-correct tape unwatchable: ≈14× the per-wall-minute
# movement of a real screen PLUS an ~82bp overnight gap every 2 wall-minutes (day boundary).
# Set 120 for fast day-cycling (EOD/VaR/backtest-style runs accumulate "days" quickly).
# The session calendar (ADR-0027) follows this on pure sim runs: a trading DAY closes every
# 120 wall seconds — daily closes, firm/book equity and day-P&L attribution are frozen at each
# boundary, working DAY orders expire, the sim gaps close->open (one correlated jump carrying
# ~30% of a day's variance), and VaR accrues its 60-day window in ~2 wall hours. Real providers
# (yahoo/finnhub) use wall-clock dates in session-zone instead.
jethro.trading.sim-seconds-per-day=23400
# Session calendar for LIVE feeds (ADR-0027): the trading day rolls at session-roll-hour
# (17 = the CME 17:00-ET futures settlement boundary) in session-zone, and weekends/US
# full-closure holidays (NYSE set, observance-shifted; Good Friday included) never own a
# session — Friday 17:30 belongs to MONDAY. Early-close half days count as full sessions
# (disclosed). Pure sim runs use the compressed tape-synchronized calendar instead.
jethro.trading.session-zone=America/New_York
jethro.trading.session-roll-hour=17
# Corporate-action / bad-print guard: a mark that jumps more than this (bps of the previous
# mark, per asset class) in ONE update QUARANTINES the instrument — the suspect price never
# reaches P&L/orders/sizing/history, an ALERT card fires, and an operator accepts the new
# level with POST /api/marks/{id}/clear-quarantine. A 2:1 split (-50%) must never be read as
# a crash. Ordinary dividends (~0.5-2%) are below any sane threshold — detecting those needs
# a real corporate-action feed (tracked follow-up). Defaults: EQUITY/DEFAULT 2000 (20%),
# FUTURE/SWAP 1000, FX/BOND 800; override per class here, 0 disables a class:
# jethro.trading.mark-jump-bps.EQUITY=2000
# jethro.trading.sim-calibration-path=/path/to/custom-calibration.json
jethro.trading.sim-start-price=100.00
# Illustrative per-instrument start levels so multi-asset prices/PnL look realistic
# (still a random walk, ADR-0009 — not a real feed). Treasury futures and swap par
# rates are NOT walked independently: sim-curve prices them from the SOFR factor curve.
jethro.trading.sim-start-prices.AAPL=190.00
jethro.trading.sim-start-prices.MSFT=430.00
jethro.trading.sim-start-prices.AMZN=185.00
jethro.trading.sim-start-prices.GOOG=175.00
jethro.trading.sim-start-prices.SAP=185.00
jethro.trading.sim-start-prices.JNJ=155.00
jethro.trading.sim-start-prices.NVDA=125.00
jethro.trading.sim-start-prices.JPM=205.00
jethro.trading.sim-start-prices.ES=5450.00
jethro.trading.sim-start-prices.NQ=19800.00
jethro.trading.sim-start-prices.EURUSD=1.085000
jethro.trading.sim-start-prices.GBPUSD=1.270000
jethro.trading.sim-start-prices.AUDUSD=0.660000
jethro.trading.sim-start-prices.ZN=110.50
jethro.trading.sim-start-prices.ZT=102.90
jethro.trading.sim-start-prices.ZF=107.30
jethro.trading.sim-start-prices.ZB=118.20
# Annualized volatility per instrument — calibrates the walk's per-tick step so moves
# are realistic (a stock can't jump 3% in 5 minutes anymore). Statistical params, not money.
jethro.trading.sim-annual-vol=0.20
jethro.trading.sim-annual-vols.AAPL=0.28
jethro.trading.sim-annual-vols.MSFT=0.24
jethro.trading.sim-annual-vols.AMZN=0.32
jethro.trading.sim-annual-vols.GOOG=0.28
jethro.trading.sim-annual-vols.SAP=0.25
jethro.trading.sim-annual-vols.JNJ=0.16
jethro.trading.sim-annual-vols.NVDA=0.45
jethro.trading.sim-annual-vols.JPM=0.26
jethro.trading.sim-annual-vols.ES=0.15
jethro.trading.sim-annual-vols.NQ=0.20
jethro.trading.sim-annual-vols.EURUSD=0.08
jethro.trading.sim-annual-vols.GBPUSD=0.09
jethro.trading.sim-annual-vols.ZN=0.05
jethro.trading.sim-annual-vols.ZT=0.02
jethro.trading.sim-annual-vols.ZF=0.04
jethro.trading.sim-annual-vols.ZB=0.10
jethro.trading.sim-tick-interval-millis=100
jethro.trading.lmdb-path=data/trading-core
jethro.trading.lmdb-max-size-mb=256
jethro.trading.buffer-capacity=4096

# Hedging advisor (ADR-0038/0039). Firm-level equity beta-hedge onto an index future, v1.
# mode: OFF | ADVISE (surface proposals) | AUTO (auto-submit — execution wiring is a follow-up).
# The book is held TARGET-FLAT: any net single-name equity is hedged back to flat (no cap band).
# equity-rebalance-floor-usd: a small anti-churn floor only — |net| at or below it is treated as
# flat so a trivial residual isn't re-hedged every cycle; 0 = always hedge to flat.
# effectiveness-floor: below this ρ² the advisor says "reduce, don't hedge" (weak proxy).
jethro.hedge.mode=AUTO
jethro.hedge.equity-rebalance-floor-usd=0
# min-trade-notional-usd: a hedge DELTA below this is not worth its spread/impact — source:
# ADR-0039 Decision 2 (the $10k churn guard). The proposal is target − held (never the full
# hedge re-sent — 2026-07-18 math review P1-1).
jethro.hedge.min-trade-notional-usd=10000
# no-trade-band-fraction: the delta ALSO trades once it is this fraction of the hedge's own scale
# (max(|target|,|held|) notional), so the absolute guard above can never strand a hedge smaller
# than itself — the effective band is the SMALLER of the two (ADR-0069). Source: the 25%-relative
# leg of the standard 5/25 band-rebalancing convention; PLACEHOLDER — Oleg to tune against
# measured ES/NQ round-trip cost. 0 disables the relative leg (pure ADR-0039 behaviour).
jethro.hedge.no-trade-band-fraction=0.25
jethro.hedge.effectiveness-floor=0.25
# min-covariance-days: the STATISTICAL tier needs this many observed days before its beta/rho^2
# size real money — source: ADR-0041 (20-day sample-cov seed + 20 EWMA steps; RiskMetrics puts
# lambda=0.94's effective memory at ~74d). Below it the STRUCTURAL tier carries the book.
jethro.hedge.min-covariance-days=40
# Proxy selection (ADR-0042): candidates evaluated each cycle — tradable (live price, not
# quarantined), highest measured rho^2 wins; a held proxy is kept unless the challenger beats it
# by proxy-switch-margin (0.10 = PLACEHOLDER, Oleg to set from realized rho^2 noise — every
# switch pays two spreads). equity-proxy stays the STRUCTURAL tier's instrument (assigned betas
# are quoted against it).
jethro.hedge.equity-proxy-candidates=ES,NQ
jethro.hedge.proxy-switch-margin=0.10
jethro.hedge.equity-proxy=ES
jethro.hedge.equity-proxy-multiplier=50
# Hedge orders trade in their own dedicated book: its proxy position is the advisor's held-hedge
# feedback, and it never collides with the strategy's futures (which route to MACRO). Clean
# strategy-vs-hedge P&L attribution per ADR-0039.
jethro.hedge.book=HEDGE
# Boot history seed (ADR-0038/0023): grounds the hedger covariance in REAL cross-asset history from
# tick one. Source = Tiingo (free, API-key gated) — the Yahoo history channel is defunct. Token from
# env (never commit it); blank → the seed is skipped and covariance warms from the live feed (logged,
# harmless). Dev/demo only, ToS-limited — not a production data path. history-seed=none disables it.
jethro.hedge.history-seed=tiingo
jethro.hedge.tiingo-token=${TIINGO_API_TOKEN:}
jethro.hedge.history-range-years=5
jethro.hedge.history-seed-days=60
# Learned advisory signal (ADR-0053) training data: a DEDICATED, rebuildable Tiingo daily-bar store,
# separate from the runtime daily_close (which is sim-contaminated at the tail). Rebuilds on empty, so
# a data wipe is a non-issue; reuses jethro.hedge.tiingo-token. Training/analytics only — never a
# number into live sizing/risk. jethro.training.enabled=false disables it.
jethro.training.enabled=true
jethro.training.years=5
# Label threshold (ADR-0053): a next-day move must clear this many basis points to be labelled UP/DOWN,
# else FLAT — the round-trip-cost floor below which there is no tradeable edge. A MODELLING choice
# (validated on the walk-forward harness), NOT a risk/money dial: it only labels the offline training
# set, never sizes or gates a live order. Default 10 bps ≈ a typical equity round-trip cost. PLACEHOLDER
# feel — tune against the harness in piece 3; it does not touch live money, so it needs no ADR sign-off.
jethro.training.label-threshold-bps=10
# Learned-signal validation gate (ADR-0053, piece 3): a PURGED, embargoed walk-forward backtest that
# scores the model net of cost and only "ships" it if it beats a coin-flip AND momentum/mean-reversion
# out-of-sample. These are MODELLING/EVALUATION dials (they grade an offline signal, never size or gate
# a live order), so no ADR sign-off — but they change the verdict, so their provenance is stated here.
# folds/embargo/min-train-rows: purged walk-forward CV shape (embargo in trading days on top of the
#   1-day label horizon). Mine, standard CV defaults — not a market convention.
jethro.training.backtest.folds=5
jethro.training.backtest.embargo-days=2
jethro.training.backtest.min-train-rows=200
# cost-bps: round-trip transaction cost the net-of-cost score charges every simulated trade. PLACEHOLDER
# — a conservative equity round-trip (~5 bp spread + ~2 bp fee, ADR-0025). SHOULD be sourced per-name
# from the ExecutionCostSource spread+fee model (deferred-register); until then one blended number.
jethro.training.backtest.cost-bps=10
# iterations/learning-rate/l2: logistic-regression fit. Mine, standard GD defaults — validated by the
# backtest itself (a bad fit simply fails to beat the baselines), not a risk dial.
jethro.training.backtest.iterations=400
jethro.training.backtest.learning-rate=0.3
jethro.training.backtest.l2=0.001

# Per-signal health telemetry (ADR-0055 phase 1): record each source's live directional call and score
# it by the realised forward return of following it — the EVIDENCE the fusion layer will weight sources
# by. MEASUREMENT ONLY; nothing here sizes, gates, or orders (ADR-0016 / invariant 7), so these are
# analytics dials, not risk dials. Mine, sensible defaults — tune from observed behaviour.
jethro.signals.enabled=true
# horizon-seconds: how far ahead the forward return is measured (wall-clock; in sim the fast tape covers
#   plenty). flat-threshold-bps: the move a call must clear to be WIN/LOSS, else FLAT (the noise floor).
jethro.signals.horizon-seconds=3600
# horizon-rungs: how many horizons each call is ALSO graded over, geometrically down from the base at
#   the 4x span ratio the trend sensor already uses — 3 => 3600s / 900s / 225s (ADR-0082). The horizon
#   is half of the gate's comparison (a return over a period vs a cost per round trip) and, since
#   ADR-0080, the desk's holding period too; it was one number chosen before any of this book's evidence
#   existed. Measuring the ladder lets the DATA say over what period this desk's edge is real. Not a
#   money/risk dial — a measurement length; it sizes nothing. 3 is MINE: enough span to separate "an
#   hour" from "a few minutes" (a 16x range) while keeping the multiple-testing haircut small. The
#   search is PAID FOR — the edge gate divides its alpha by this count (Bonferroni), so every rung,
#   including the base, faces a strictly harder bar than the single-horizon gate did. Set 1 to disable
#   (exactly the pre-ADR-0082 behaviour). Cost of raising it: alpha/rungs, and rows ~ sum of 4^k.
jethro.signals.horizon-rungs=3
jethro.signals.flat-threshold-bps=10
jethro.signals.rolling-days=7
jethro.signals.sample-limit=500
jethro.signals.resolve-interval-seconds=60
# cohort-window-seconds: calls recorded within this gap of each other are ONE draw of the market, not
#   independent ones, so the expectancy standard error is taken ACROSS cohorts (Fama–MacBeth) rather
#   than across observations (ADR-0077). A source that emits its whole cross-section in one ~200ms burst
#   was otherwise credited with 23 independent samples for one hour of market. 60s is MINE, chosen two
#   orders of magnitude above a burst's width; merging is the conservative direction (fewer independent
#   cohorts ⇒ wider standard error ⇒ stricter edge gate), so erring long is the safe error.
jethro.signals.cohort-window-seconds=60

# Signal-fusion forecast normalisation (ADR-0055 phase 2): each source's raw call → a Carver-capped
# forecast on [-20,+20] with expected |reading| ~10. These scalars WILL gate/size orders once phase 3-4
# consume them, so they are money-gating dials, NOT free analytics — provenance required (CLAUDE.md).
# All PLACEHOLDER — Oleg to set; each SHOULD be estimated from the phase-1 telemetry (expected |z| of
# firing signals, conviction win-spacing, per-channel edge), not left at these seeds. Inert until phase 3.
jethro.fusion.strategy.expected-abs-z=3.0
jethro.fusion.hypothesis.conviction-step=5.0
jethro.fusion.social.per-channel=4.0
jethro.fusion.learned.scale=20.0
# Fusion combination + target (ADR-0055 phase 3) — money-gating (route-orders is ON below). assumed-correlation
# sizes the diversification multiplier (0..1; higher ρ = less scale-up on many correlated sources). unit-notional
# is the deterministic cash-at-risk per name at a typical (TARGET_ABS) forecast — a cap forecast targets 2× it.
# buffer-fraction + adjustment-rate are the Garleanu-Pedersen no-trade band and partial-trade rate.
# unit-notional-usd + buffer-fraction: OLEG-SET 2026-07-21 (sim exposure choices — 50k typical / 100k at cap,
#   and a deliberately WIDE 0.5 band = only re-trade when >50% off target, low-churn). assumed-correlation:
#   still MINE (placeholder), to validate — revise on evidence, not silently.
jethro.fusion.assumed-correlation=0.5
jethro.fusion.unit-notional-usd=50000
jethro.fusion.buffer-fraction=0.5
# adjustment-rate: 0 = DERIVE it (ADR-0080), which is the shipped mode — it is no longer a dial. The rate
#   is a = 1 - exp(-interval-seconds / jethro.signals.horizon-seconds), the unique fraction whose exposure
#   time constant tau = -interval/ln(1-a) equals the horizon each source's expectancy is measured over. That
#   makes the edge gate dimensionally sound: it credits one horizon of return against ONE round-trip cost,
#   so the desk must actually hold for one horizon per round trip it pays. At 30s/3600s that is 0.0082987...
#   (tau = 3600s); the previous hand-set 0.5 gave tau = 43s, i.e. ~83 round trips charged against one
#   horizon's credit. Provenance: derived identity + Garleanu & Pedersen, JF 68(6) 2013 — not a chosen
#   number. Only the RISK-INCREASING part of a delta is rated; exits trade in full (ADR-0080). A positive
#   value here overrides the derivation (escape hatch only).
jethro.fusion.adjustment-rate=0
# Fusion loop (ADR-0055 phase 4/5). enabled turns the loop on; interval/freshness pace it. route-orders
# makes the fusion layer the SOLE order origin: it routes each netted delta through the same gates the
# direct paths used (firm breaker, ADR-0049 backtest support, pre-trade guardrail), and the strategy's own
# auto-exec + the hypothesis autonomy STAND DOWN. false = SHADOW (computes the target book, places nothing).
# Routing runs on ANY feed now (incl. a LIVE feed = PAPER TRADING on real marks): fills are always internal
# (SimulatedExecutor) — there is NO real-broker path. The real-money guard is ADR-0015 (extract the `order`
# module before wiring a real broker), NOT a feed-mode gate. (Supersedes the old ADR-0019 sim-only routing.)
# route-orders: OLEG-SET true 2026-07-21 — fusion is the SOLE (paper) order origin; the sizing dials above
#   are his chosen values. Return to SHADOW by setting this false.
jethro.fusion.enabled=true
jethro.fusion.interval-seconds=30
jethro.fusion.freshness-seconds=600
jethro.fusion.route-orders=true
# ADR-0059: conviction floor — fusion routes a delta only when |combined forecast| clears this (Carver
# [-20,+20] scale, ~10 = a typical firing). Stops churn on weak/oscillating signals. 5.0 = mine, tune.
jethro.fusion.min-forecast-to-route=5.0
# Per-source combination weights (ADR-0055 item 6, statistic per ADR-0067, sample per ADR-0074).
# mode=telemetry (default) re-estimates each source's weight from the phase-1 telemetry every cycle —
# evidence = Phi(t) of its own measured expectancy, shrunk toward the pooled mean by Buhlmann
# credibility n/(n+shrinkage-k) over its RESOLVED observations, then centred on 1.0 and bounded
# [min,max]. mode=equal forces the flat placeholder. shrinkage-k/min/max are MODELLING dials (mine, to
# validate against OOS — NOT market conventions): higher k = more shrinkage toward equal; min>0 keeps a
# decayed source contributing (the combiner drops weight<=0). Weights are ratios normalised by their sum
# downstream, so they rotate conviction between sources and never scale the book.
jethro.fusion.weights.mode=telemetry
# ADR-0074: shrinkage-k IS the thin-sample defence — the resolved-observation count at which a source's
# own reading is half-trusted against the pooled prior. At 20, three calls sit ~87% on the prior, so a
# lucky run cannot up-weight a noise source. The former weights.min-sample hard floor was a second,
# discontinuous copy of this that pinned below-average sources at a MORE trusting 1.0; it is gone.
jethro.fusion.weights.shrinkage-k=20
jethro.fusion.weights.min=0.25
jethro.fusion.weights.max=3.0
# ADR-0064: cost-aware edge gate on the sole order origin. Each cycle it compares every source's
# MEASURED expectancy (signal telemetry, this feed mode) against the desk's MEASURED round-trip
# slippage (TCA, this feed mode). If no source's surplus clears the significance hurdle, fusion goes
# REDUCE-ONLY: positions may be cut or closed, none opened or grown. It can only ever remove trades the
# planner already wanted — never add one — and it re-opens by itself when a source earns its cost.
# ADR-0075: that comparison is made PER NAME, against that name's own measured round trip — the desk's
# TCA spans two orders of magnitude, so one blended hurdle both suppresses edge that survives in the
# cheap names and admits round trips that cost more than the edge in the expensive ones. The desk-wide
# verdict is the same test at the cheapest round trip the desk can actually pay; a name that has never
# filled is charged the measured blend (never an invented cost), so its bar is unchanged.
# t-hurdle=2.0 is a STATISTICAL CONVENTION (~95% two-sided), not a money number: Harvey/Liu/Zhu (RFS
# 2016) argue an even higher bar (>=3.0) once multiple testing is counted, so this is the permissive
# end. min-sample=30 is the usual small-sample threshold for leaning on a standard error. Both are
# conventions and dials, NOT market rules — raise them to trade less, lower them to trade more.
# ADR-0081: the dial states a CONFIDENCE LEVEL, not a fixed number of standard errors. The gate reads
# it as a one-sided alpha = 1 - Phi(t-hurdle) (2.0 => 0.02275, unchanged) and tests the surplus against
# Student's t on cohorts-1 degrees of freedom, because the ADR-0077 standard error is ESTIMATED from
# those cohorts. Identical to the old rule in the large-sample limit; strictly stricter below it, where
# a cross-sectional source spends hours at single-digit cohort counts.
jethro.fusion.edge-gate.enabled=true
jethro.fusion.edge-gate.min-sample=30
jethro.fusion.edge-gate.t-hurdle=2.0
# ADR-0083: the per-name budget above is ONE flat cash figure, so a name's risk contribution is
# proportional to its own volatility — on this universe measured daily sigma spans roughly 7x between a
# major FX cross and the most volatile equity, so the flat rule silently concentrates the book in a
# handful of names. The budget is now split by each name's MEASURED daily sigma (the same EWMA
# covariance the parametric VaR and the ADR-0079 multiplier already use): notional_i = unit-notional x
# sigma_ref / sigma_i, where sigma_ref is the harmonic mean over the covered names — the unique
# reference that leaves the covered budgets summing to what they summed to before. So unit-notional-usd
# is UNCHANGED and keeps Oleg's meaning exactly: the cash for a name of TYPICAL volatility. No new money
# number is introduced, and the book is capped at the gross it replaced (it can redistribute or shrink,
# never lever up on an estimated sigma).
# winsor-pct is a ROBUST-SCALING CONVENTION, not a money/risk/exposure number: it clips each tail of the
# measured sigma cross-section at that percentile so one degenerate estimate (a thin or stale history
# reading near-zero sigma) cannot claim an unbounded share. It moves no total. 10 = MINE and arbitrary
# (PLACEHOLDER — Oleg to set); 0 disables clipping.
jethro.fusion.vol-budget.winsor-pct=10.0
# ADR-0086: the fusion desk's RISK-REACTIVE EXIT — a volatility-scaled trailing stop (chandelier exit).
# Everything above decides how much risk the desk WANTS; nothing above asks whether a position it already
# HOLDS has gone wrong. The firm drawdown breaker is a whole-book backstop, and the legacy strategy path
# has had jethro.strategy.stop-loss-pct since ADR-0019, but the fusion path — the sole order origin, and
# the one running a mean-reversion view whose payoff is short optionality — has had no per-name cut at all.
# A name is cut to FLAT once its mark has retraced from the best level seen since the position was opened
# by more than sigma-multiple x the name's own MEASURED sigma over the desk's own holding horizon, and it
# stays reduce-only for one holding horizon before it may be re-entered. The horizon is DERIVED (ADR-0080
# at the ADR-0082-selected rung), not dialled. The control can only ever set a target flat — it can never
# raise one, so an estimated sigma can never lever the book up, and a name with no measured sigma is left
# exactly as planned (no measurement, no claim — ADR-0016 / invariant 7).
# sigma-multiple=3.0 is a PLACEHOLDER — Oleg to set. It is NOT derived from this desk's measurements: it
# is the conservative end of the conventional chandelier-exit distance (2.5-3 x ATR, LeBeau), read against
# a horizon sigma rather than an ATR. "Conservative" for a CUT rule means reluctant to cut: a stop set
# inside the ordinary noise of the holding period turns the strategy's routine winners into realised
# losses and destroys the expectancy it is meant to protect. Raising it cuts later and rarer; lowering it
# cuts sooner and more often. 0 or below falls back to the same 3.0.
# vol-span is the EWMA span of the sigma sensor in samples (interval-seconds apart) and doubles as its
# warm-up — a statistical convention, not a money/risk/exposure number. 120 at the 30s fusion cadence is
# an hour of history, seeded on first sight from the durable mark store (ADR-0071) since that exceeds the
# process lifetime on a redeployed desk.
jethro.fusion.risk-cut.enabled=true
jethro.fusion.risk-cut.sigma-multiple=3.0
jethro.fusion.risk-cut.vol-span=120
# ADR-0089: the correlation input for the two sizing controls (ADR-0079 concentration, ADR-0083 vol
# budget), measured on the MARK STREAM because the daily-close covariance they were written against
# covers a name only after several admissible sessions in the running feed mode (ADR-0073) — and so
# covers none of a young stream's book, leaving both controls silent exactly where the concentration is.
# Neither dial is a money/risk/exposure number: enabled only chooses WHICH measurement is used (the
# estimate covering more of the planned book wins, ties to the incumbent daily one), and span is the
# EWMA span in synchronised samples, which doubles as the warm-up before a pair may speak — 120 at the
# 30s cadence is an hour, matching the risk-cut sigma sensor and seeded from the same durable mark store.
# Both consumers are scale-invariant in the covariance, so the sampling period cannot move a size.
jethro.fusion.stream-covariance.enabled=true
jethro.fusion.stream-covariance.span=120
# ADR-0066: the trend sensor — a continuous EWMAC forecast source published alongside the others. The
# spans below are LOOKBACK LENGTHS in evaluation cycles (interval-seconds apart), not money/risk/exposure
# numbers: the sensor normalises its own output to the house convention (expected |forecast| ~ TARGET_ABS)
# whatever they are, so changing them changes WHICH trends it sees, never how big the book is. The book's
# size stays governed by unit-notional-usd, the conviction floor, the edge gate and the guardrail above.
# fast/slow: Carver (Systematic Trading, 2015) EWMAC16/64 — one of his standard variations, slow = 4x fast.
# normalisation-span=256 (4x slow) is MINE: long enough that "typical reading" is a property of the stream
# rather than of the trend being measured. All three are shape dials — tune on measured edge, not taste.
jethro.fusion.trend.enabled=true
jethro.fusion.trend.interval-seconds=5
jethro.fusion.trend.fast-span=16
jethro.fusion.trend.slow-span=64
jethro.fusion.trend.normalisation-span=256

# ADR-0070: the mean-reversion sensor — the chop-regime counterpart of the trend sensor above, on the
# identical contract (a forecast source that must earn its measured expectancy before the edge gate lets
# it size anything). The spans below are LOOKBACK LENGTHS in evaluation cycles (interval-seconds apart),
# not money/risk/exposure numbers: the sensor normalises its own output to the house convention
# (expected |forecast| ~ TARGET_ABS) whatever they are, so changing them changes WHICH stretches it
# fades, never how big the book is. Book size stays governed by unit-notional-usd, the conviction floor,
# the edge gate and the guardrail above.
# range-span=120 at a 10s cadence = a 20-minute range, ~1/3 of jethro.signals.horizon-seconds (1h) — the
# stretch should have room to revert INSIDE the window its expectancy is measured over. That ratio is
# MINE and arbitrary; tune it on measured edge, not taste. normalisation-span=240 (2x range-span, 40 min)
# mirrors the trend sensor's 4x proportion at the shorter base: long enough that "typical reading" is a
# property of the stream rather than of the stretch being measured. Both are shape dials.
jethro.fusion.reversion.enabled=true
jethro.fusion.reversion.interval-seconds=10
jethro.fusion.reversion.range-span=120
jethro.fusion.reversion.normalisation-span=240

# Stall watchdog (footprint §7.6): a max-priority thread that writes ONE diagnostic dump (thread dump +
# deadlocks + heap/GC + RSS/swap from /proc + zombie count) the moment the app stalls — so the recurring
# freeze self-diagnoses instead of being inferred. Cheap, observational. Dumps land in dump-dir.
jethro.watchdog.enabled=true
jethro.watchdog.check-seconds=10
jethro.watchdog.stall-threshold-seconds=45
jethro.watchdog.pause-tolerance-seconds=10
jethro.watchdog.dump-dir=logs
# Shared scheduled pool (footprint §7.3): caps the per-subsystem thread proliferation. New periodic work
# (fusion, signal telemetry) runs here; migrating the older lifecycles onto it is a follow-up.
jethro.scheduler.shared-threads=3

# local SLM tier (ADR-0016): Ollama in compose; narrates, never computes numbers
jethro.ai.enabled=true
jethro.ai.base-url=http://localhost:11434
# Default profile targets a capable box (laptop / 8GB+ Pi): qwen2.5:3b for stronger narration. Viable now
# that ChatModelRecycler + a short keep-alive cap llama-server's growth (it used to climb into swap). The
# `pi` profile drops this to 0.5b for tight boxes; run-local.sh can override with MODEL=. Narration only —
# never computes a number (ADR-0016). llama3.2:3b is a fine lateral swap (its 128K default context is held
# safe by jethro.ai.num-ctx below — Ollama caps the KV to that, not the model's full window).
jethro.ai.model=qwen2.5:3b
jethro.ai.interval-seconds=60
jethro.ai.max-output-tokens=200
# On a Pi, qwen2.5:3b inference measured ~60-70s/call (prompt eval dominates, ~1-2 tok/s), so a
# low timeout would kill valid generations mid-flight and show as "ollama unreachable". 180s
# leaves headroom (incl. the slow FIRST call that loads the model into memory). Watch the Ops page:
# if p95 latency creeps toward this, use a smaller model (e.g. qwen2.5:1.5b / llama3.2:1b) or a
# GPU box rather than raising it further. See the Ops (Ollama load) page for live latency/tok-s.
jethro.ai.request-timeout-seconds=180
# Ops/resource dials (NOT money/risk). keep-alive: how long Ollama keeps the model resident after a
# call. SHORT so a genuinely idle box unloads and reclaims llama-server's memory. (This replaces a
# hardcoded 30m in OllamaClient that pinned the model resident forever under our ~20s polling, so its
# slow native growth never reset — the observed box-freeze leak: llama-server RSS climbed ~1.6GB over
# the model weights and into swap.) 5m keeps it warm across an active narration burst.
jethro.ai.keep-alive=5m
# Caps the per-request KV cache instead of using the model's larger default (qwen2.5:1.5b defaults to
# 4096). 2048 is ample for our short narration prompts and roughly halves resident KV. Mine to tune.
jethro.ai.num-ctx=2048
# Backstop for llama-server's intrinsic native growth: force-unload the chat model on this cadence so
# RSS sawtooths (peak ≈ weights + one interval of growth) instead of climbing unbounded. The next call
# reloads it (a few seconds on 1.5B — advisory only, never the tick path). 0 disables. 30m mine to tune.
jethro.ai.recycle-minutes=30

# broker + ui (ADR-0012/0015/0017)
server.port=8080
jethro.kafka.enabled=true
jethro.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Mark is "stale" (feed went quiet) after this long WITHOUT a new update — measured against
# local receive time, not the provider's (possibly delayed) timestamp. Must exceed the feed's
# update interval: 45s covers the Yahoo 15s poll (3 missed polls) and the 100ms sim tick.
jethro.ui.stale-after-millis=45000
# recent price history per instrument for the interactive chart (hours). Durable in LMDB
# (ADR-0014, derived data) so a long window survives a restart and reads fast — the chart
# offers up to 12h, so retention matches. Durable long-term history is the S3 Parquet
# archive (ADR-0014), a separate concern.
jethro.ui.history-hours=12
# LMDB store for the chart history. Own subdir so one data volume covers it + trading-core.
jethro.ui.history-path=data/ui-history
jethro.ui.history-max-size-mb=256
# md.marks boot replay only refreshes the current-price snapshot (history is durable in LMDB),
# so a short window keeps boot fast — this app is the sole mark producer, nothing to backfill.
jethro.ui.replay-window-minutes=30
# A disconnected SSE client (browser tab closed/refreshed) makes Tomcat log a benign
# broken-pipe write as ERROR. The app handles it (drops the client) — keep the noise out.
logging.level.org.apache.catalina.core.ContainerBase.[Tomcat].[localhost].[/].[dispatcherServlet]=OFF

# toy momentum strategy (step 8 / ADR-0018): proposes advisory suggestions onto the
# attention feed, sized to target notional and gated by the pre-trade guardrail; never
# auto-routes. A stand-in until the frontier tier (ADR-0010) arrives.
# LIVE-TUNABLE (ADR-0052): the numbers below are the SEED/defaults — most jethro.strategy.* dials
# can be overridden at runtime from /strategy.html (persisted to Postgres, precedence: override >
# this file). A live override's provenance is its audit row (who/when/old→new), not this comment.
# The OOS backtest/selector always read THESE values, never overrides, so edge measurement stays
# reproducible. interval-seconds + book routing stay config-only (structural).
jethro.strategy.enabled=true
jethro.strategy.interval-seconds=5
# Vol-adaptive signal: fires when the ~2-minute window move exceeds threshold-sigmas ×
# the instrument's OWN realized vol (a fixed bps bar can't fit equities and Treasuries
# at once — it either fires on noise or never). min-signal-bps floors out dust moves.
# Still no edge on a random-walk sim — mechanism demo, not alpha.
# Signal algo: "momentum" (default) or "mean-reversion" — the SAME z-score detector read in
# opposite directions (fade the extreme instead of chasing it). Both run through identical
# guardrails, vol-targeted sizing, execution costs and the multi-seed OOS harness — compare
# them honestly on /backtest.html (algo selector) or /api/backtest?algo=mean-reversion.
# mean-reversion is the default: the 2026-07-19 post-mortem showed momentum bleeds on this
# mean-reverting sim tape (ALPHA −$1,494, every name losing — it buys the breakout and the tape
# reverts). Per-instrument momentum-vs-mean-reversion OOS selection is the durable fix (its own
# ADR); this flip is the immediate, reversible stop-the-bleed, validated on /backtest.html.
jethro.strategy.algo=mean-reversion
# Per-instrument strategy selection (ADR-0043): the OOS harness measures momentum vs
# mean-reversion per instrument and the live strategy trades the winner (nothing where neither
# has a positive median edge). `algo` above is only the fallback until the first measurement.
# seed-count 9 = odd majority (ADR-0027 median gate). ticks must be LONG: the backtest evaluates
# every ~50 ticks (5s cadence / 100ms tick), so a rare 2.5σ signal needs many thousands of ticks
# to fire enough times to measure — 5000 ticks gave ~0-1 trades and starved the selector. 25000
# ≈ 500 evaluations per seed. Until a name is actually measured (≥1 backtest trade), the live
# strategy runs the DEFAULT algo — it is never suppressed on a no-measurement. interval-minutes
# and initial-delay bound the background cost / let boot finish first.
jethro.strategy.selection.enabled=true
jethro.strategy.selection.seed-count=9
jethro.strategy.selection.ticks=25000
jethro.strategy.selection.interval-minutes=60
jethro.strategy.selection.initial-delay-seconds=90
# Regime-aware selection (ADR-0044): a PRICE-DERIVED trend detector (Kaufman efficiency ratio) picks
# momentum in a trend / mean-reversion in chop and switches when the regime turns; the OOS selector
# above becomes the edge gate (veto to no-trade only when the trend-matched algo has a measured
# non-positive median). NO sim regime label is ever read (invariant 8 — sim=prod parity). Set
# trend.enabled=false to fall back to the regime-blind ADR-0043 OOS pick.
# window/bands are an INITIAL MODELLING CHOICE per ADR-0044 (to validate against OOS, not a market
# convention and not a risk rule): window=20 evals (~100s of marks at the 5s cadence); ER≥0.5 → TREND,
# ER≤0.3 → CHOP, between = hysteresis hold. These are mine and arbitrary — Oleg to calibrate.
jethro.strategy.trend.enabled=true
jethro.strategy.trend.window=20
jethro.strategy.trend.upper-band=0.5
jethro.strategy.trend.lower-band=0.3
# Risk-off sizing regime (ADR-0051) is SENSED FROM PRICES — the trading path never reads the sim's
# regime label (that only exists in sim; sensing keeps sim=live=replay parity). Elevated = market
# realized-vol proxy >= upper-factor × its EWMA baseline; back to calm under lower-factor (hysteresis).
# In ELEVATED, new-entry notional is scaled by jethro.strategy.regime-volatile-scale. window/factors/
# lambda are an initial modelling choice (mine, to validate — not a market convention or risk rule).
jethro.strategy.volregime.window=30
jethro.strategy.volregime.upper-factor=1.5
jethro.strategy.volregime.lower-factor=1.1
jethro.strategy.volregime.ewma-lambda=0.97
# Social source (ADR-0050) — adversarial: spam pre-filter + corroboration gate, ADVISORY ONLY (a
# social subject can NEVER originate an order, ADR-0049). ALWAYS REAL DATA — social media is an
# always-online external source with NO relation to the market-data sim; there is no synthetic runtime
# feed. The dials below are scheduling / spam-defence knobs, not risk/money numbers (mine, tune
# freely): k=2 distinct credible channels to corroborate; burst 4 flags a pump; >3 cashtags is shill.
jethro.social.enabled=true
jethro.social.interval-seconds=60
jethro.social.corroboration-channels=2
jethro.social.burst-threshold=4
jethro.social.max-cashtags=3
jethro.social.credible-follower-floor=5000
jethro.social.credible-age-days-floor=180
# Real sources only (ADR-0050): stocktwits and/or telegram. default-tier=STANDARD so organic accounts
# are judged by the credibility floors (a curated channel in channel-tiers can still be TRUSTED). A
# subject seen on TWO different sources corroborates. Subjects are NOT restricted to the configured
# universe — an untracked name social is discussing surfaces as a "suggest add". symbols-per-cycle
# round-robins the tracked equities as a rate-limit guard.
jethro.social.sources=stocktwits
jethro.social.default-tier=STANDARD
jethro.social.stocktwits-base-url=https://api.stocktwits.com/api/2
jethro.social.stocktwits-symbols-per-cycle=3
# Telegram (ADR-0050 Phase 2b): reads public channels the bot is added to (getUpdates). Token from
# env; blank → the source is idle. Telegram gives no follower count, so a Telegram channel is credible
# only when curated TRUSTED in jethro.social.channel-tiers. Enable with sources=sim,telegram.
jethro.social.telegram-base-url=https://api.telegram.org
jethro.social.telegram-bot-token=${TELEGRAM_BOT_TOKEN:}
# Universe discovery (ADR-0045/0050 §7): real news outlets propose additions to the base tracked list;
# social enriches / adds an emerging name. Suggestions only — NEVER adds an instrument or trades.
# Weights/cap are heuristics (mine), not risk numbers.
jethro.discovery.enabled=true
jethro.discovery.interval-seconds=300
jethro.discovery.max-candidates=100
jethro.discovery.news-weight=3.0
jethro.discovery.social-weight=1.0
# Default outlets (name → RSS URL) — free, no-API-key, canonical public RSS 2.0 feeds. Official
# institutions first (authoritative: central banks, the market regulator, the labour-stats agency),
# then two broad market feeds. The adapter is fail-open: a dead/blocked outlet shows "unreachable"
# and the rest still poll. Edit/extend freely — these are examples, not a risk/money setting. (SEC
# rejects a blank User-Agent; the adapter now sends a descriptive one.) Add your own, e.g.
# jethro.discovery.outlets.ft=https://.../rss. Atom-only feeds aren't parsed yet (RSS <item> only).
jethro.discovery.outlets.fed=https://www.federalreserve.gov/feeds/press_all.xml
jethro.discovery.outlets.sec=https://www.sec.gov/news/pressreleases.rss
jethro.discovery.outlets.boe=https://www.bankofengland.co.uk/rss/news
jethro.discovery.outlets.bls=https://www.bls.gov/feed/bls_latest.rss
jethro.discovery.outlets.cnbc=https://www.cnbc.com/id/15839069/device/rss/rss.html
jethro.discovery.outlets.yahoo=https://finance.yahoo.com/news/rssindex

# --- Dynamic discovery-driven universe (ADR-0060) ---------------------------------------------------
# The promotion gate that turns discovery candidates into tracked names (universe_promotion table,
# /api/universe/proposals + the Discover page). ENABLED. With write=true it PROMOTES a passing name into
# the reference-data master — a first-class instrument that flows through the whole decision system
# (marks / indicators / strategy / OOS / model / fusion). Promotion = INCLUSION in the universe, NOT a
# trade; whether it trades is gated separately downstream (OOS backtest, guardrail, breaker). Set
# enabled=false to turn the feature dark, or write=false for dry-run (decide + audit, write nothing).
jethro.universe.dynamic.enabled=true
jethro.universe.dynamic.write=true
# OLEG 2026-07-24: a name is admitted when score > 250 AND mentions > 50 — that's the rule. Promotion =
# INCLUSION in the universe (not a trade); it flows through the decision system immediately, checked every
# ~5 min. The other gates below (sustained/sources) are set non-blocking so score + mentions are the binding
# checks; raise them if you want extra conditions. (feed-coverage stays required — a name the feed can't
# price is useless.)
# min discovery score (credibility-weighted cross-source rank).
jethro.universe.dynamic.min-score=250.0
# min total mentions — how much it's being talked about.
jethro.universe.dynamic.min-mentions=50
# sustained — minimum distinct calendar days mentioned. 1 = non-blocking (score+mentions are the rule).
jethro.universe.dynamic.min-sustained-days=1
# corroborated sources — 1 = non-blocking (score+mentions are the rule). Raise to require multiple sources.
jethro.universe.dynamic.min-sources=1
# rate limit — at most this many promotions granted per session-day.
jethro.universe.dynamic.max-promotions-per-day=2
# hard cap on tracked discovered names (box + poll budget); when full, the stalest discovered name is evicted.
jethro.universe.dynamic.max-monitored=50
# Re-evaluation cadence: 300s so a qualifying name is admitted promptly (not once a day). Scheduling knob.
jethro.universe.dynamic.evaluation-interval-seconds=300
# Human overrides (comma-separated instrumentIds). blacklist = never admit; pin-list = never evict.
jethro.universe.dynamic.blacklist=
jethro.universe.dynamic.pin-list=
# Provisional liquidity dials stamped on a promoted name (flagged in refdata) until its ADV is measured
# from its own tape — they size/cost its orders meanwhile (an honest starting assumption, tune freely).
jethro.universe.dynamic.provisional-adv-usd=50000000
jethro.universe.dynamic.provisional-spread-bps=20

jethro.strategy.lookback=24
# The z-score threshold is the ADAPTIVE signal filter (self-calibrates to each instrument's own
# vol); min-signal-bps is only a dust floor. CALIBRATION NOTE: an earlier 15bp floor was ~9σ on
# this sim (per-tick σ ≈ 0.34bp → a 24-tick window moves ~1.7bp typically, ~5bp at 3σ), so the
# strategy fired ZERO signals and the OOS selector marked every name NO-TRADE — the book went
# flat. A fixed-bp floor must be sized to the sim's realized vol, not a generic round-trip number.
# threshold 2.5σ + a 2bp dust floor fire enough for the OOS harness to actually MEASURE edge;
# churn is controlled by the 300s cooldown + the selector standing down no-edge names.
jethro.strategy.threshold-sigmas=2.5
jethro.strategy.min-signal-bps=2
jethro.strategy.target-notional=25000
# Vol-TARGETED sizing (primary once daily history accrues — ~10 sim days ≈ 20 min at
# 120s/day): order notional = risk-budget-daily / σ_daily, where σ is the EWMA (λ=0.94)
# of recorded daily-close returns — the SAME history VaR uses. Capped per class. Worked:
# $250/day ÷ 1.8%/day (AAPL) = $13,889; ÷ 0.40%/day (ZN) = $62,500 — every position
# carries a comparable daily P&L swing. The AI sleeve sizes with the same formula.
# Until measured: strategy falls back to target-notional × signal-vol scale; AI to
# target-notional flat. 250 ≈ 25k × 1%/day, matching the old typical-equity size.
jethro.strategy.risk-budget-daily=250
# Position-aware participation (quant-engine phase 5): once a book holds 3x target
# notional in an instrument, same-direction signals are skipped; reducing ones pass.
jethro.strategy.max-position-notional=75000
# Per-class order cap: one Treasury futures contract (~$107-118k) is a normal rates
# order; ZT ($206k) stays unsizeable. Bond futures now participate in order-picking —
# and their sim prices derive FROM the curve (duration model), so it's coherent.
jethro.strategy.max-order-notional-by-class.BOND=150000
# One swap lot = $1M notional quoted as par-rate% × DV01-based multiplier (V9): the
# "order notional" the sizer sees is rate × multiplier ≈ $180k (5Y) / $330k (10Y) — a
# rate-times-DV01 risk figure, not face. Cap admits the 5Y lot; 10Y stays unsizeable.
jethro.strategy.max-order-notional-by-class.SWAP=250000
# Route auto-orders to the book that fits the instrument's asset class, instead of piling
# everything into one book (which caps fast). `book` is the fallback for unmapped classes.
jethro.strategy.book=ALPHA
jethro.strategy.book-by-class.EQUITY=ALPHA
jethro.strategy.book-by-class.FUTURE=MACRO
jethro.strategy.book-by-class.FX=MACRO
jethro.strategy.book-by-class.BOND=MACRO
jethro.strategy.book-by-class.SWAP=MACRO
# Auto-execute admissible signals as SIMULATED orders (ADR-0019). OFF by default; must
# never be enabled against a real broker. Cooldown throttles per-instrument submissions.
# Raised 60→300s (post-mortem F4): a 60s re-entry churned ES 32× in one session; a 5-min
# per-instrument cooldown lets a reversion play out before re-trading the same name.
jethro.strategy.auto-execute=true
jethro.strategy.auto-cooldown-seconds=300
# Long-only by default: a SELL signal may only REDUCE an existing long, never open or
# extend a short. Set true to let the strategy take shorts (macro books may want this).
jethro.strategy.allow-short=true
# The risk-reducing half of the loop (ADR-0019): without exits a losing position rides
# forever and a floored book just re-alarms. Per-position stop-loss / take-profit as a
# fraction of entry (0.008 = 0.8%); book de-risk flattens a managed book once its total
# loss reaches its configured max-loss cap. All submit SIMULATED risk-reducing orders.
jethro.strategy.stop-loss-pct=0.008
jethro.strategy.take-profit-pct=0.016
jethro.strategy.derisk-on-loss-cap=true
# Regime-aware sizing (quant-engine phase 5): scale NEW-entry notional in the sim's VOLATILE
# regime (risk-off in turbulence). 0.5 = half size; 0 = stand aside; 1 = no scaling. Exits and
# de-risking are never scaled — you can always reduce. The backtest mirrors this so its
# measured PnL reflects the same behaviour.
jethro.strategy.regime-volatile-scale=0.5

# LLM hypothesis layer (ADR-0022): the local SLM synthesises marks + a narrative sim feed
# + the portfolio into structured, NUMBER-FREE theses; the deterministic quant layer sizes
# and pre-trade-gates each; admissible ones surface on the attention feed for human review,
# and bounded autonomy (below) may auto-execute inside its deterministic envelope.
# Sizing reuses jethro.strategy.* (target notional, per-class caps, book routing).
jethro.hypothesis.enabled=true
# The AI sleeve trades its OWN book, separate from the momentum strategy's ALPHA/MACRO, so the
# two engines never flatten each other's positions (the algo was undoing AI trades → cost bleed).
jethro.hypothesis.book=AI
# Cadence: this is the delay AFTER each cycle finishes before the next starts (fixed-delay, so
# cycles never overlap/backlog). One cycle is dominated by the local SLM inference — watch the
# "hypotheses: … took Nms" log line to see how long yours takes on the box. Effective spacing ≈
# interval + inference time. 20s is fine; below the inference time it just runs back-to-back.
# NOTE: news only refreshes every narrative-refresh-seconds (60s, shared Finnhub budget), so
# running much faster than that re-reasons over the same headlines (prices still move, though).
jethro.hypothesis.interval-seconds=20
jethro.hypothesis.max-per-cycle=3
jethro.hypothesis.max-output-tokens=400
# Narrative (news) feed for the model. With a Finnhub token set (jethro.trading.finnhub-token)
# this is REAL news — general market + per-company headlines (ADR-0024), independent of the
# price provider. Without a token (e.g. CI) it's the seedable sim feed below, whose headlines
# correlate with the sim's market regime so the story matches the price action. Deterministic.
jethro.hypothesis.narrative-seed=42
# Min seconds between real-news refreshes — caps free-tier API calls independent of the
# hypothesis cadence. Ignored by the sim feed.
jethro.hypothesis.narrative-refresh-seconds=60
# Each thesis is annotated with a multi-seed OOS backtest of the MOMENTUM strategy on its
# instrument (ADR-0027). ADVISORY ONLY — it measures a different strategy's edge, so it does
# NOT gate autonomy (it used to, which silently revoked all AI trading once honest execution
# costs landed). Ticks of sim tape replayed per seed per cycle. Cheap.
jethro.hypothesis.backtest-ticks=15000
# Bounded autonomy (ADR-0022, amended by ADR-0027): OFF by default. When enabled, a thesis
# that is admissible, conviction ≥ min, and whitelisted (empty = all) auto-submits a SIMULATED
# order (ADR-0019) — SIZED by the AI's own MEASURED track record (scored outcomes at horizon
# expiry, ADR-0027):
#   PROBATION — fewer than min-track-record scored outcomes: orders resized down to
#               probation-order-notional so the record builds at small size.
#   EARNED    — full record AND measured outcome P&L > 0: full size up to max-order-notional
#               (over-cap rejected, never resized — full size must be deliberate).
#   REVOKED   — full record with non-positive P&L: no auto-execution, human review only.
# The model never widens this — it is operator config. NEVER a real broker.
# enabled is turned on at run time by AUTONOMY=on ./scripts/run-local.sh (kept false here so
# CI/tests never auto-trade). MEDIUM lets the small model's typical conviction through.
jethro.hypothesis.autonomy.enabled=false
jethro.hypothesis.autonomy.min-conviction=MEDIUM
jethro.hypothesis.autonomy.max-order-notional=30000
jethro.hypothesis.autonomy.cooldown-seconds=300
# Probation order size while the track record builds (default: max-order-notional / 4).
jethro.hypothesis.autonomy.probation-order-notional=7500
# Scored outcomes required before autonomy is judged on (and sized by) its record.
jethro.hypothesis.autonomy.min-track-record=10
# jethro.hypothesis.autonomy.whitelist=AAPL,MSFT   # optional; empty = all price-quoted names

# Execution model (ADR-0025): per-class spreads/fees default in code (EQUITY 5+1bp,
# FUTURE/BOND 1+0.2, FX 1+0, SWAP 0.4bp additive) — override via jethro.execution.spread-bps.*
# / fee-bps.*. Market impact: MARKET fills additionally pay the square-root law
# sigma_daily x sqrt(notional/ADV) when the instrument has an adv_usd attribute (refdata V19)
# AND measured daily vol; the participation cap below rejects orders over that fraction of
# ADV outright (0 disables). Both unmodelled -> spread+fee only, disclosed.
jethro.execution.max-adv-participation=0.02

# Walk-forward replay on REAL daily bars (ADR-0027): generate the bars file on a networked
# host with `python3 scripts/fetch_bars.py` (Stooq, ~6y daily closes; ES/NQ use index
# proxies, stated), then GET /api/backtest/walkforward (or the Backtest page). Parameters
# are chosen per fold on the FIT window only and measured on the UNSEEN eval window.
jethro.backtest.bars-path=data/historical-bars.json

# risk limits (ADR-0017 deterministic floor / ADR-0018 guardrail): per-book caps with
# per-book overrides, a per-instrument concentration cap, and firm-wide aggregate caps.
# Loss caps are ENFORCED pre-trade: a book past max-loss may only reduce risk. WARN at
# warn-ratio of a cap, ALERT at/over it. Demo values — tune to real risk appetite.
jethro.risk.max-gross-exposure=500000
jethro.risk.max-net-exposure=300000
jethro.risk.max-loss-pnl=25000
jethro.risk.max-instrument-exposure=200000
jethro.risk.warn-ratio=0.80
# Firm circuit breaker (ADR-0027): at this drawdown from the PEAK firm total P&L, ALL
# auto-execution halts (strategy entries + AI autonomy; risk-reducing exits and manual orders
# stay allowed) until an operator resets: POST /api/breaker/reset. Remove/0 to disable.
jethro.risk.max-firm-drawdown=50000
# MACRO limits sized for the swap GROSS-NOTIONAL exposure convention (V22): one swap lot
# now counts as $1M of exposure (it is $1M of notional), so the caps leave room for a
# couple of lots alongside the futures book. DV01 remains the real rates-risk measure.
jethro.risk.books.MACRO.max-gross-exposure=3000000
jethro.risk.books.MACRO.max-net-exposure=2000000
jethro.risk.books.MACRO.max-loss-pnl=50000
jethro.risk.books.MACRO.max-instrument-exposure=1500000
# HEDGE book (ADR-0039/0040): dedicated book for hedge orders only. Caps sized to COVER the
# equity books it hedges — target hedge notional ≈ β̂ (≈1.8 measured in sim) × the equity
# gross the base caps allow, so the MACRO numbers are mirrored rather than invented anew.
# A cap here that is too small silently blocks the hedge — the guardrail rejects the order.
jethro.risk.books.HEDGE.max-gross-exposure=3000000
jethro.risk.books.HEDGE.max-net-exposure=2000000
jethro.risk.books.HEDGE.max-loss-pnl=50000
jethro.risk.books.HEDGE.max-instrument-exposure=3000000
jethro.risk.firm.max-gross-exposure=1500000
jethro.risk.firm.max-net-exposure=1000000
jethro.risk.firm.max-loss-pnl=75000

# reference data (ADR-0005/0008): manual DataSource+Flyway wiring (see RefDataConfig)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
jethro.persistence.enabled=true
jethro.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/jethro}
jethro.datasource.username=${POSTGRES_USER:jethro}
jethro.datasource.password=${POSTGRES_PASSWORD:jethro}

# Correlated market regimes on the sim (calm/trend/volatile/shock episodes) so trends,
# vol spikes and limit alarms actually happen — same seed, same regime path (ADR-0009).
# STEADY BASELINE (the sim's purpose: a calm, realistic tape you shape with the mixer, not one
# that spontaneously lurches 100bp/sec). Auto-regime vol spikes and auto-news are OFF by default —
# the mixer (per-instrument vol/drift faders) and the manual ⚡ news button are how you inject moves
# and watch the model react. Set sim-regimes=true / sim-news-per-day>0 to let the tape move itself.
jethro.trading.sim-regimes=false
jethro.trading.sim-news-per-day=0
