# Raspberry Pi 4 profile (see docs/deploy/raspberry-pi.md).
# Activate with: SPRING_PROFILES_ACTIVE=pi ./gradlew :app:bootRun
# CPU-only SLM inference on a Pi is slow, so use the smallest model, run it less
# often, and give it a wide timeout. The market path never waits on inference.
jethro.ai.model=qwen2.5:0.5b
jethro.ai.interval-seconds=180
# 180s (not 120s): run-local.sh defaults the chat model to qwen2.5:3b, which on Pi CPU runs ~60-70s/call
# and is periodically reloaded after ChatModelRecycler unloads it (cold load ~1min). 180s covers
# load+generate so a valid call isn't killed mid-flight and shown as "ollama unreachable". Ample for 0.5b.
jethro.ai.request-timeout-seconds=180
# Footprint dials for the Pi (see application.properties for what each does). Tighter than the
# defaults: a smaller KV cap, a shorter keep-alive so the model unloads promptly when idle, and a
# more aggressive recycle so llama-server's native growth resets before it can eat the box.
jethro.ai.num-ctx=1024
jethro.ai.keep-alive=2m
jethro.ai.recycle-minutes=15
# The hypothesis loop is the heaviest Ollama caller (base default 20s). On a Pi that back-to-back
# polling is what pinned the model resident and drove the leak — slow it right down here. The base
# profile leaves this at 20s; the Pi profile MUST override it or the 0.5b model is still hammered.
jethro.hypothesis.interval-seconds=120

# All tickable sim instruments (negligible load) so the live feed matches the seeded
# reference data — equities, index futures, FX, and the Treasury futures curve. This
# profile OVERRIDES application.properties, so the hedge-focused additions (JNJ/NVDA/JPM/
# AUDUSD) must be listed here too or the Pi sim silently keeps the old universe.
jethro.trading.sim-instruments=AAPL,MSFT,AMZN,GOOG,SAP,JNJ,NVDA,JPM,ES,NQ,EURUSD,GBPUSD,AUDUSD,ZN,ZT,ZF,ZB
