# Raspberry Pi 4 profile (see docs/deploy/raspberry-pi.md).
# Activate with: SPRING_PROFILES_ACTIVE=pi ./gradlew :app:bootRun
# CPU-only SLM inference on a Pi is slow, so use the smallest model, run it less
# often, and give it a wide timeout. The market path never waits on inference.
jethro.ai.model=qwen2.5:0.5b
jethro.ai.interval-seconds=180
jethro.ai.request-timeout-seconds=120

# All tickable sim instruments (negligible load) so the live feed matches the seeded
# reference data — equities, index futures, FX, and the Treasury futures curve. This
# profile OVERRIDES application.properties, so the hedge-focused additions (JNJ/NVDA/JPM/
# AUDUSD) must be listed here too or the Pi sim silently keeps the old universe.
jethro.trading.sim-instruments=AAPL,MSFT,AMZN,GOOG,SAP,JNJ,NVDA,JPM,ES,NQ,EURUSD,GBPUSD,AUDUSD,ZN,ZT,ZF,ZB
