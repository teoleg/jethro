name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Build + unit/module tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build -Pci   # -Pci runs the unit/module suite (skipped in local builds)
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/**"

  integration:
    name: Full-stack integration (real broker + real model)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    env:
      JETHRO_IT_MODEL: qwen2.5:0.5b # small = fast CI; same code path as any model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Start infra (Redpanda, Postgres, Ollama)
        run: docker compose up -d redpanda postgres ollama

      - name: Wait for Redpanda
        run: |
          timeout 120 bash -c \
            'until docker compose exec -T redpanda rpk cluster health --exit-when-healthy >/dev/null 2>&1; do sleep 3; done'

      - name: Pull the real model (no stubs)
        run: docker compose exec -T ollama ollama pull "$JETHRO_IT_MODEL"

      # Hard gate, not best-effort: when Ollama is broken on a runner (e.g. a llama-server
      # segfault — seen 2026-07-14 with an unpinned image), `|| true` here let the job burn
      # 9 minutes to an opaque await-timeout in FullStackIT. Failing HERE labels the failure
      # as infra, in seconds, with the container log attached.
      - name: Warm up the model (hard gate)
        run: |
          for attempt in 1 2 3; do
            if docker compose exec -T ollama ollama run "$JETHRO_IT_MODEL" "Reply with the single word ready"; then
              echo "model generated on attempt $attempt"
              exit 0
            fi
            echo "warm-up attempt $attempt failed — restarting ollama and retrying"
            docker compose restart ollama
            sleep 5
          done
          echo "::error::Ollama cannot generate on this runner (llama-server crash?). This is an INFRA failure, not a code failure — re-run the job."
          docker compose logs ollama --tail 100
          exit 1

      - name: Full-stack integration tests
        run: ./gradlew :app:integrationTest -Pci   # integrationTest is not gated, but keep the flag consistent

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 300

      - name: Upload IT reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: app/build/reports/tests/integrationTest/**
