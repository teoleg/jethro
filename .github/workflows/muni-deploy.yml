name: Muni Deploy

# muni-world's pipeline on the SAME rails as the WORKING jethro path (bake.yml/launch.yml):
# static AWS keys from the EXISTING repo secrets, hardcoded region, Packer bakes an AMI with the
# whole stack, run-instances replaces the node. No CDK, no OIDC, nothing to pre-provision by hand
# — the workflow idempotently ensures the few AWS pieces it needs (backup bucket, instance
# role/profile, security group).
#
# AUTO on every green push to the muni branch (owner directive: only the data load is manual),
# plus manual dispatch. Unlike jethro's stateless node, muni has a DATABASE: the old node is
# backed up to S3 before it is replaced, and the AMI's boot step seeds a fresh instance from the
# newest backup — state survives every deploy.
#
# Repo variables (Settings -> Variables), both optional-ish:
#   MUNI_ALLOWED_CIDR   REQUIRED for first launch: who may reach :8090 (e.g. 203.0.113.7/32 —
#                       your IP; the SG is the access control, same posture as jethro's node)
#   MUNI_CONTACT_EMAIL  SEC fair-access contact baked into the AMI env (sec.gov 403s without it)
#   MUNI_EIP_ALLOC_ID   optional eipalloc-... for a stable IP across replacements
on:
  push:
    branches: [claude/muni-world-aws-deploy]
    paths: ["muni-world/**", ".github/workflows/muni-deploy.yml"]
  workflow_dispatch:
    inputs:
      instance_type:
        description: Runtime instance type
        type: choice
        default: t3a.small
        options: [t3a.small, t3a.medium, t3.small]
      ref:
        description: Git ref to bake + deploy
        type: string
        default: claude/muni-world-aws-deploy

concurrency:
  group: muni-deploy
  cancel-in-progress: false

env:
  # Same hardcoded region as the jethro bake (edit this one line to change it).
  AWS_REGION: us-east-2
  DEPLOY_REF: ${{ inputs.ref || github.sha }}
  # t3a.small (2 vCPU / 2GiB, ~$14/mo on-demand — AWS's published rate; the SIZE is the owner's
  # dial via manual dispatch). x86 to stay on the exact AMI path jethro proved.
  INSTANCE_TYPE: ${{ inputs.instance_type || 't3a.small' }}

jobs:
  # THE GATE: nothing bakes unless the whole muni suite is green on this exact commit —
  # lattice identities, QuantLib cross-validation, curve-validation gates, all of it.
  test:
    name: Test muni-world
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run the muni-world test suite
        run: ./gradlew :muni-world:test -Pci --no-daemon

  bake-and-deploy:
    name: Bake AMI + replace node
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Configure AWS credentials (same secrets as the jethro bake)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Idempotent: bucket (versioned), node role+instance profile (SSM + that bucket), SG.
      - name: Ensure AWS prerequisites
        env:
          ALLOWED_CIDR: ${{ vars.MUNI_ALLOWED_CIDR }}
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="muni-world-backups-$ACCOUNT"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-public-access-block --bucket "$BUCKET" --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
            echo "created versioned bucket $BUCKET"
          fi
          if ! aws iam get-role --role-name muni-world-node >/dev/null 2>&1; then
            aws iam create-role --role-name muni-world-node --assume-role-policy-document '{
              "Version":"2012-10-17","Statement":[{"Effect":"Allow",
              "Principal":{"Service":"ec2.amazonaws.com"},"Action":"sts:AssumeRole"}]}'
            aws iam attach-role-policy --role-name muni-world-node \
              --policy-arn arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
            aws iam put-role-policy --role-name muni-world-node --policy-name muni-backups \
              --policy-document "{\"Version\":\"2012-10-17\",\"Statement\":[
                {\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:ListBucket\",\"s3:GetBucketLocation\"],
                 \"Resource\":[\"arn:aws:s3:::$BUCKET\",\"arn:aws:s3:::$BUCKET/*\"]}]}"
            aws iam create-instance-profile --instance-profile-name muni-world-node
            aws iam add-role-to-instance-profile --instance-profile-name muni-world-node \
              --role-name muni-world-node
            echo "created role + instance profile muni-world-node"; sleep 10
          fi
          SG=$(aws ec2 describe-security-groups --filters Name=group-name,Values=muni-world-sg \
               --query 'SecurityGroups[0].GroupId' --output text)
          if [ "$SG" = "None" ] || [ -z "$SG" ]; then
            [ -n "$ALLOWED_CIDR" ] || { echo "::error::set the MUNI_ALLOWED_CIDR repo variable (your IP, e.g. 203.0.113.7/32) — the SG is the access control"; exit 1; }
            SG=$(aws ec2 create-security-group --group-name muni-world-sg \
                 --description "muni-world :8090, owner IP only" \
                 --query GroupId --output text)
            aws ec2 authorize-security-group-ingress --group-id "$SG" \
              --protocol tcp --port 8090 --cidr "$ALLOWED_CIDR"
            echo "created SG $SG (8090 from $ALLOWED_CIDR)"
          fi
          echo "MUNI_SG_ID=$SG" >> "$GITHUB_ENV"

      - name: Package source
        run: git archive --format=tar.gz -o muni-world/deploy/packer/muni-src.tgz HEAD

      - uses: hashicorp/setup-packer@v3

      - name: Bake AMI
        working-directory: muni-world/deploy/packer
        env:
          CONTACT: ${{ vars.MUNI_CONTACT_EMAIL }}
        run: |
          packer init .
          packer build -var region="$AWS_REGION" -var src_archive=muni-src.tgz \
            -var contact_email="$CONTACT" .
          AMI=$(python3 -c "import json;print(json.load(open('manifest.json'))['builds'][-1]['artifact_id'].split(':')[1])")
          echo "AMI_ID=$AMI" >> "$GITHUB_ENV"
          echo "baked $AMI"

      # State survives the replace: back the old node up (best-effort — first deploy has none).
      - name: Backup old node before replacing it
        run: |
          set -euo pipefail
          OLD=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=muni-world" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          echo "OLD_IDS=$OLD" >> "$GITHUB_ENV"
          for id in $OLD; do
            echo "pre-replace backup on $id"
            CMD_ID=$(aws ssm send-command --instance-ids "$id" \
              --document-name AWS-RunShellScript \
              --parameters 'commands=["bash /opt/muni-world/muni-world/deploy/backup-to-s3.sh"]' \
              --query 'Command.CommandId' --output text) || continue
            aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$id" || true
          done

      - name: Launch new node, retire old
        env:
          EIP_ALLOC: ${{ vars.MUNI_EIP_ALLOC_ID }}
        run: |
          set -euo pipefail
          NEW=$(aws ec2 run-instances \
            --image-id "$AMI_ID" --instance-type "$INSTANCE_TYPE" \
            --security-group-ids "$MUNI_SG_ID" \
            --iam-instance-profile Name=muni-world-node \
            --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=muni-world},{Key=project,Value=muni-world},{Key=service,Value=muni-world}]' \
            --query 'Instances[0].InstanceId' --output text)
          echo "launched $NEW; waiting for running"
          aws ec2 wait instance-running --instance-ids "$NEW"
          [ -n "${EIP_ALLOC:-}" ] && aws ec2 associate-address --allocation-id "$EIP_ALLOC" --instance-id "$NEW"
          for id in ${OLD_IDS:-}; do
            [ "$id" != "$NEW" ] && aws ec2 terminate-instances --instance-ids "$id" >/dev/null \
              && echo "terminated old $id" || true
          done
          IP=$(aws ec2 describe-instances --instance-ids "$NEW" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          echo "### muni-world up: http://${IP}:8090 (instance $NEW)" >> "$GITHUB_STEP_SUMMARY"
          echo "boot restores the newest S3 backup automatically; give it ~2 minutes."
