# muni-world — independent service config (its OWN port, schema, LMDB env and Kafka topics).
# Every value here is scaffolding for the subproject; money/risk dials (when muni-world gets any) will
# carry provenance the same way jethro's do.

spring.application.name=muni-world
# Its own port so it runs alongside the jethro app (:8080) on one host.
server.port=${MUNI_PORT:8090}

# OS PDFs (uploaded to /api/muni/ingest/os-pdf) can be large — allow up to 32 MB.
spring.servlet.multipart.max-file-size=32MB
spring.servlet.multipart.max-request-size=32MB

# Auto-load: drop OS PDFs into this folder and they're loaded + indexed automatically (processed files move
# to <dir>/processed). Scanned every scan-ms. No manual upload needed. This is the ONLY OS-ingest path —
# EMMA is never scraped (its Terms of Use prohibit automated access); a human downloads the public OS PDF and
# drops it here (or uploads it at /api/muni/ingest/os-pdf).
muni.os.inbox.dir=${MUNI_OS_INBOX:os-inbox}
muni.os.inbox.scan-ms=${MUNI_OS_SCAN_MS:30000}

# --- Postgres: the SHARED jethro database, muni-world's OWN `muni` schema inside it (ADR-0006: "the
# shared instance, muni schema"). One container, one database, no provisioning: every muni table is
# namespaced muni.* (Flyway default-schema below + explicit muni. prefixes in queries), so nothing
# collides with jethro's tables. Defaults mirror jethro's compose dev creds; override via env for real
# deployments (creds are dev PLACEHOLDERS, same as jethro's).
spring.datasource.url=${MUNI_DB_URL:jdbc:postgresql://localhost:5432/jethro}
spring.datasource.username=${MUNI_DB_USER:jethro}
spring.datasource.password=${MUNI_DB_PASSWORD:jethro}
# Never probe the DB at boot — the jar must start (and serve its UI) with no live Postgres.
spring.datasource.hikari.initialization-fail-timeout=-1
# Fail a connection attempt fast when Postgres is down (not a money/risk dial — a wait bound): the DB write
# is best-effort and health is cached, so a down DB must not stall a load or the status poll. 2s, env-tunable.
spring.datasource.hikari.connection-timeout=${MUNI_DB_CONNECT_TIMEOUT_MS:2000}
# Flyway owns muni-world's schema; OFF by default so the jar boots offline. Turn on when Postgres is up.
spring.flyway.enabled=${MUNI_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=muni

# --- LMDB: embedded, memory-mapped, DERIVED data only; muni-world's own env (under build/, gitignored). ---
muni.lmdb.path=${MUNI_LMDB_PATH:build/muni-lmdb}
muni.lmdb.map-size-mb=${MUNI_LMDB_MAP_MB:64}

# --- Kafka / Redpanda: the SHARED broker; muni-world publishes/consumes only its own `muni.*` topics. ---
# OFF by default — no consumer/producer starts until wired; enable when the broker is reachable.
muni.kafka.enabled=${MUNI_KAFKA_ENABLED:false}
muni.kafka.bootstrap=${MUNI_KAFKA_BOOTSTRAP:localhost:19092}

# --- Audio capture + transcription (ADR-0014): local ASR of a LICENSED broadcast feed, soft-signal only. ---
# Tool paths, not risk dials. Empty model = "not configured" → a transcribe call fails loudly (never silent).
# These run only on the Pi (audio device + binaries present); the sandbox has neither, so nothing runs here.
muni.audio.whisper.bin=${MUNI_WHISPER_BIN:whisper-cli}
muni.audio.whisper.model=${MUNI_WHISPER_MODEL:}
muni.audio.whisper.timeout-sec=${MUNI_WHISPER_TIMEOUT:600}
muni.audio.ffmpeg.bin=${MUNI_FFMPEG_BIN:ffmpeg}
# The capture LOOP is OFF by default — the jar boots identically in CI/sandbox (no audio device). Master
# switch; svc.sh tv start/stop flips it. FEEDS themselves are a REGISTRY, not a var (below).
muni.audio.capture.enabled=${MUNI_AUDIO_CAPTURE:false}
muni.audio.capture.gap-ms=${MUNI_AUDIO_GAP_MS:1000}
# TV/audio source REGISTRY (like the market-data/social sources) — the editable feed list. Points at a host
# file you edit (id,label,publisher,category,device,chunk_seconds,enabled,notes); blank → the committed
# classpath default. Served at /api/muni/audio/sources and shown in the muni UI.
muni.audio.sources.file=${MUNI_AUDIO_SOURCES_FILE:}
# Descriptive UA (identifies the project per ADR-0008) for the Socrata open-data fetch.
muni.http.user-agent=${MUNI_HTTP_UA:muni-world/0.1 (+municipal-data-collection)}

# --- OS extraction Phase 3 (ADR-0015): OCR fallback + assisted extraction ---
# OCR scanned OS PDFs via tesseract (installed on the Pi only). Off by default; the deterministic native-text
# parse is always tried first, OCR only when the text is sparse (image-only PDF).
muni.ocr.enabled=${MUNI_OCR_ENABLED:false}
muni.ocr.bin=${MUNI_OCR_BIN:tesseract}
muni.ocr.dpi=${MUNI_OCR_DPI:300}
# Below this deterministic-parse confidence (and only if a ModelExtractor bean is wired), try model-assisted
# extraction — every proposed number is verified against the source text before it can land (ADR-0012/0016).
muni.extract.assisted-threshold=${MUNI_ASSISTED_THRESHOLD:0.5}
