# muni-world — independent service config (its OWN port, schema, LMDB env and Kafka topics).
# Every value here is scaffolding for the subproject; money/risk dials (when muni-world gets any) will
# carry provenance the same way jethro's do.

spring.application.name=muni-world
# Its own port so it runs alongside the jethro app (:8080) on one host.
server.port=${MUNI_PORT:8090}

# --- Postgres: the SHARED instance, muni-world's OWN database/schema. Creds are PLACEHOLDERS (env-set). ---
spring.datasource.url=${MUNI_DB_URL:jdbc:postgresql://localhost:5432/muni_world}
spring.datasource.username=${MUNI_DB_USER:muni}
spring.datasource.password=${MUNI_DB_PASSWORD:muni}
# Never probe the DB at boot — the jar must start (and serve its UI) with no live Postgres.
spring.datasource.hikari.initialization-fail-timeout=-1
# Flyway owns muni-world's schema; OFF by default so the jar boots offline. Turn on when Postgres is up.
spring.flyway.enabled=${MUNI_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=muni

# --- LMDB: embedded, memory-mapped, DERIVED data only; muni-world's own env (under build/, gitignored). ---
muni.lmdb.path=${MUNI_LMDB_PATH:build/muni-lmdb}
muni.lmdb.map-size-mb=${MUNI_LMDB_MAP_MB:64}

# --- Kafka / Redpanda: the SHARED broker; muni-world publishes/consumes only its own `muni.*` topics. ---
# OFF by default — no consumer/producer starts until wired; enable when the broker is reachable.
muni.kafka.enabled=${MUNI_KAFKA_ENABLED:false}
muni.kafka.bootstrap=${MUNI_KAFKA_BOOTSTRAP:localhost:19092}

# --- Audio capture + transcription (ADR-0014): local ASR of a LICENSED broadcast feed, soft-signal only. ---
# Tool paths, not risk dials. Empty model = "not configured" → a transcribe call fails loudly (never silent).
# These run only on the Pi (audio device + binaries present); the sandbox has neither, so nothing runs here.
muni.audio.whisper.bin=${MUNI_WHISPER_BIN:whisper-cli}
muni.audio.whisper.model=${MUNI_WHISPER_MODEL:}
muni.audio.whisper.timeout-sec=${MUNI_WHISPER_TIMEOUT:600}
muni.audio.ffmpeg.bin=${MUNI_FFMPEG_BIN:ffmpeg}
# The capture LOOP is OFF by default — the jar boots identically in CI/sandbox (no audio device). Master
# switch; svc.sh tv start/stop flips it. FEEDS themselves are a REGISTRY, not a var (below).
muni.audio.capture.enabled=${MUNI_AUDIO_CAPTURE:false}
muni.audio.capture.gap-ms=${MUNI_AUDIO_GAP_MS:1000}
# TV/audio source REGISTRY (like the market-data/social sources) — the editable feed list. Points at a host
# file you edit (id,label,publisher,category,device,chunk_seconds,enabled,notes); blank → the committed
# classpath default. Served at /api/muni/audio/sources and shown in the muni UI.
muni.audio.sources.file=${MUNI_AUDIO_SOURCES_FILE:}

# --- Polite crawl + EMMA discovery (ADR-0008 / ADR-0015 Phase 2) ---
# Descriptive UA (identifies the project per ADR-0008) and a per-host min interval so a crawl never hammers.
muni.http.user-agent=${MUNI_HTTP_UA:muni-world/0.1 (+municipal-data-collection)}
muni.crawl.min-interval-ms=${MUNI_CRAWL_INTERVAL_MS:2000}
# EMMA is JS-heavy and its scheme/markup change + it's unreachable from CI — so the security-URL template and
# the OS-link pattern are CONFIG, tuned on the Pi where EMMA is reachable, not hard-coded assumptions.
muni.emma.security-url-template=${MUNI_EMMA_URL:https://emma.msrb.org/Security/Details/{cusip}}
muni.emma.os-link-pattern=${MUNI_EMMA_OS_PATTERN:(?i)(\\.pdf(\\?|$)|officialstatement|/Document/|securitydocument)}
