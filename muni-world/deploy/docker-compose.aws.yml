# muni-world's AWS stack (muni ADR-0021) — the shape baked into the AMI, mirroring the proven
# jethro path: docker compose behind an IP-LOCKED security group (the SG is the access control,
# exactly like jethro's working deployment serves :8080). Only :8090 is published; Postgres stays
# on the compose network.
#
# Credentials posture, same as jethro's baked path: dev-style defaults inside a box whose only
# open port is the app's, restricted to the owner's IP. MUNI_CONTACT_EMAIL (the SEC fair-access
# address) is injected via the systemd unit's EnvironmentFile (/opt/muni-world/muni.env), written
# at bake time from a repo variable — never committed to git.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: muni
      POSTGRES_USER: ${MUNI_DB_USER:-muni}
      POSTGRES_PASSWORD: ${MUNI_DB_PASSWORD:-muni}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d muni"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  muni:
    image: muni-world:local          # baked into the AMI by packer/provision.sh
    ports:
      - "8090:8090"                  # the SG restricts WHO can reach it (owner IP only)
    environment:
      MUNI_DB_URL: jdbc:postgresql://postgres:5432/muni
      MUNI_DB_USER: ${MUNI_DB_USER:-muni}
      MUNI_DB_PASSWORD: ${MUNI_DB_PASSWORD:-muni}
      MUNI_FLYWAY_ENABLED: "true"
      MUNI_CONTACT_EMAIL: ${MUNI_CONTACT_EMAIL:-}
      MUNI_LMDB_PATH: /data/lmdb
      MUNI_OS_INBOX: /data/os-inbox
    volumes:
      - muni-data:/data              # LMDB index (derived) + the OS-PDF inbox (S3-backed nightly)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/api/muni/status >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres-data:
  muni-data:
