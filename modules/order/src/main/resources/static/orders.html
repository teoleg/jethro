<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jethro — orders</title>
<style>
  :root {
    --bg:#0a0d13; --surface:#141926; --surface-2:#1a2030; --line:#252d3d; --line-2:#323c50;
    --txt:#e6eaf2; --dim:#8b95a8; --brand:#5b8cff; --buy:#35c07a; --sell:#f0553f; --fill:#5b8cff;
  }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body {
    background:
      radial-gradient(1100px 600px at 78% -10%, rgba(91,140,255,.10), transparent 60%),
      var(--bg);
    color:var(--txt);
    font:14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono { font-variant-numeric:tabular-nums; font-family:"SF Mono", ui-monospace, "JetBrains Mono", Menlo, monospace; }

  .topbar { position:sticky; top:0; z-index:10; backdrop-filter:blur(10px);
            background:rgba(10,13,19,.72); border-bottom:1px solid var(--line); }
  .bar { display:flex; align-items:center; gap:20px; padding:0 24px; height:56px; max-width:1200px; margin:0 auto; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.14em; font-size:15px; }
  .brand .dot { width:9px; height:9px; border-radius:50%; background:var(--brand);
                box-shadow:0 0 0 4px rgba(91,140,255,.18); }
  .tabs { display:flex; gap:4px; margin-left:8px; }
  .tab { position:relative; padding:8px 14px; border-radius:8px; color:var(--dim);
         text-decoration:none; font-size:13px; font-weight:500; transition:.15s; }
  .tab:hover { color:var(--txt); background:var(--surface); }
  .tab.active { color:var(--txt); background:var(--surface-2); }
  .tab.active::after { content:""; position:absolute; left:14px; right:14px; bottom:-1px;
                       height:2px; border-radius:2px; background:var(--brand); }
  .spacer { flex:1; }
  .hint { color:var(--dim); font-size:12px; }

  main { max-width:1080px; margin:0 auto; padding:20px 24px 48px; display:grid; gap:18px; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 20px; }
  .panel h2 { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.14em; margin-bottom:14px; }

  form { display:flex; gap:12px; flex-wrap:wrap; align-items:end; }
  label { display:flex; flex-direction:column; font-size:11px; color:var(--dim); gap:5px; letter-spacing:.04em; }
  input, select { background:#0c1019; color:var(--txt); border:1px solid var(--line-2); border-radius:8px;
                  padding:9px 11px; font:inherit; transition:.15s; }
  input:focus, select:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(91,140,255,.18); }
  button { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:10px 20px; font:inherit;
           font-weight:600; cursor:pointer; transition:.15s; }
  button:hover { filter:brightness(1.08); }
  button:active { transform:translateY(1px); }
  #msg { color:var(--dim); font-size:12px; margin-top:12px; min-height:16px; }
  #msg.ok { color:var(--buy); } #msg.err { color:var(--sell); }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); }
  tr:last-child td { border-bottom:0; }
  tbody tr { transition:.1s; } tbody tr:hover { background:var(--surface-2); }
  th { color:var(--dim); font-weight:500; font-size:10px; text-transform:uppercase; letter-spacing:.08em; }
  td.num { text-align:right; }
  .BUY { color:var(--buy); font-weight:600; } .SELL { color:var(--sell); font-weight:600; }
  .status { font-size:10px; letter-spacing:.06em; padding:3px 9px; border-radius:999px; border:1px solid var(--line-2); color:var(--dim); }
  .FILLED { color:var(--buy); border-color:var(--buy); }
  .REJECTED { color:var(--sell); border-color:var(--sell); }
  .ROUTED, .NEW { color:var(--dim); }
  .muted { color:var(--dim); }
</style>
</head>
<body>
<div class="topbar">
  <div class="bar">
    <span class="brand"><span class="dot"></span>JETHRO</span>
    <nav class="tabs">
      <a class="tab" href="/">Attention</a>
      <a class="tab" href="/books.html">Books</a>
      <a class="tab active" href="/orders.html">Orders</a>
    </nav>
    <span class="spacer"></span>
    <span class="hint">simulated execution</span>
  </div>
</div>
<main>
  <section class="panel">
    <h2>New order</h2>
    <form id="f">
      <label>Book<select name="bookId"><option>ALPHA</option><option>BETA</option><option>FIRM</option></select></label>
      <label>Instrument<select name="instrumentId"><option>AAPL</option><option>MSFT</option><option>AMZN</option><option>GOOG</option></select></label>
      <label>Side<select name="side"><option>BUY</option><option>SELL</option></select></label>
      <label>Type<select name="type"><option>MARKET</option><option>LIMIT</option></select></label>
      <label>Qty<input name="quantity" value="100" size="6"></label>
      <label>Limit<input name="limitPrice" placeholder="(market)" size="8"></label>
      <button type="submit">Submit</button>
    </form>
    <div id="msg"></div>
  </section>
  <section class="panel">
    <h2>Orders</h2>
    <div id="orders" class="muted">loading…</div>
  </section>
  <section class="panel">
    <h2>Fills</h2>
    <div id="fills" class="muted">loading…</div>
  </section>
</main>
<script>
  const esc = s => { const d=document.createElement("span"); d.textContent=s??""; return d.innerHTML; };
  const t = ms => new Date(ms).toLocaleTimeString();

  async function refresh() {
    const orders = await (await fetch("/api/orders")).json();
    document.getElementById("orders").innerHTML = orders.length ?
      "<table><tr><th>time</th><th>book</th><th>instr</th><th>side</th><th>type</th><th class='num'>qty</th><th class='num'>limit</th><th>status</th></tr>" +
      orders.map(o => `<tr><td class="muted mono">${t(o.createdAtMillis)}</td><td>${esc(o.bookId)}</td><td>${esc(o.instrumentId)}</td>
        <td class="${esc(o.side)}">${esc(o.side)}</td><td class="muted">${esc(o.orderType)}</td><td class="num mono">${esc(o.quantity)}</td>
        <td class="num mono">${esc(o.limitPrice||"—")}</td><td><span class="status ${esc(o.status)}">${esc(o.status)}</span></td></tr>`).join("") + "</table>"
      : "<span class='muted'>no orders yet — submit one above</span>";
    const fills = await (await fetch("/api/fills")).json();
    document.getElementById("fills").innerHTML = fills.length ?
      "<table><tr><th>time</th><th>instr</th><th>side</th><th class='num'>qty</th><th class='num'>price</th></tr>" +
      fills.map(f => `<tr><td class="muted mono">${t(f.executedAtMillis)}</td><td>${esc(f.instrumentId)}</td>
        <td class="${esc(f.side)}">${esc(f.side)}</td><td class="num mono">${esc(f.quantity)}</td><td class="num mono">${esc(f.price)}</td></tr>`).join("") + "</table>"
      : "<span class='muted'>no fills yet</span>";
  }

  document.getElementById("f").addEventListener("submit", async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());
    const msg = document.getElementById("msg");
    try {
      const res = await fetch("/api/orders", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)});
      const o = await res.json();
      if (res.ok) { msg.className = "ok"; msg.textContent = `submitted ${o.orderId} → ${o.status}`; }
      else { msg.className = "err"; msg.textContent = "rejected: " + (o.error || JSON.stringify(o)); }
    } catch (err) { msg.className = "err"; msg.textContent = "error: " + err; }
    refresh();
  });

  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
