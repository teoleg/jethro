<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jethro — orders</title>
<style>
  :root {
    --bg:#0a0d13; --surface:#141926; --surface-2:#1a2030; --line:#252d3d; --line-2:#323c50;
    --txt:#e6eaf2; --dim:#8b95a8; --brand:#5b8cff; --buy:#35c07a; --sell:#f0553f;
  }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { background:radial-gradient(1100px 600px at 78% -10%, rgba(91,140,255,.10), transparent 60%), var(--bg);
         color:var(--txt); font:14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  .mono { font-variant-numeric:tabular-nums; font-family:"SF Mono", ui-monospace, "JetBrains Mono", Menlo, monospace; }
  .idcell { font-size:11px; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
  .idcell:hover { color:var(--txt); text-decoration:underline; }
  .idcell.copied { color:var(--buy); }

  .topbar { position:sticky; top:0; z-index:10; backdrop-filter:blur(10px); background:rgba(10,13,19,.72); border-bottom:1px solid var(--line); }
  .bar { display:flex; align-items:center; gap:20px; padding:0 24px; height:56px; max-width:1780px; margin:0 auto; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.14em; font-size:15px; }
  .brand .dot { width:9px; height:9px; border-radius:50%; background:var(--brand); box-shadow:0 0 0 4px rgba(91,140,255,.18); }
  .tabs { display:flex; gap:4px; margin-left:8px; }
  .tab { position:relative; padding:8px 14px; border-radius:8px; color:var(--dim); text-decoration:none; font-size:13px; font-weight:500; transition:.15s; }
  .tab:hover { color:var(--txt); background:var(--surface); }
  .tab.active { color:var(--txt); background:var(--surface-2); }
  .tab.active::after { content:""; position:absolute; left:14px; right:14px; bottom:-1px; height:2px; border-radius:2px; background:var(--brand); }
  .spacer { flex:1; }
  .btn { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:9px 16px; font:inherit; font-weight:600; cursor:pointer; transition:.15s; }
  .btn:hover { filter:brightness(1.08); } .btn:active { transform:translateY(1px); }

  main { max-width:1780px; margin:0 auto; padding:18px 24px 48px; }
  .section-h { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin:0 2px 12px; display:flex; align-items:center; }
  .section-h .muted { margin-left:auto; text-transform:none; letter-spacing:0; font-size:12px; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:2px 4px; }

  /* compact blotter — Excel-density rows */
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th, td { text-align:right; padding:2px 12px; border-bottom:1px solid var(--line); line-height:1.7; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2), th:nth-child(3), td:nth-child(3) { text-align:left; }
  tbody tr:last-child td { border-bottom:0; } tbody tr:hover { background:var(--surface-2); }
  th { color:var(--dim); font-weight:500; font-size:10px; text-transform:uppercase; letter-spacing:.08em; }
  .BUY { color:var(--buy); font-weight:600; } .SELL { color:var(--sell); font-weight:600; }
  .muted { color:var(--dim); }
  .pgbtn { background:var(--surface-2); color:var(--dim); border:1px solid var(--line-2); border-radius:7px;
           padding:4px 10px; font:inherit; font-size:12px; cursor:pointer; }
  .pgbtn:hover { color:var(--txt); border-color:var(--brand); }
  .st { font-size:10px; letter-spacing:.05em; padding:2px 8px; border-radius:999px; border:1px solid var(--line-2); color:var(--dim); }
  .st.FILLED { color:var(--buy); border-color:var(--buy); }
  .st.PARTIALLY_FILLED, .st.ROUTED { color:#e0a83d; border-color:#e0a83d; }
  .st.REJECTED, .st.CANCELLED { color:var(--sell); border-color:var(--sell); }

  /* modal */
  .overlay { position:fixed; inset:0; background:rgba(6,8,13,.66); backdrop-filter:blur(3px); display:none; align-items:flex-start; justify-content:center; z-index:50; }
  .overlay.open { display:flex; }
  .dialog { background:var(--surface); border:1px solid var(--line-2); border-radius:16px; padding:20px 22px; margin-top:9vh; width:min(520px, 92vw); box-shadow:0 24px 60px rgba(0,0,0,.5); }
  .dialog h2 { font-size:15px; margin-bottom:16px; display:flex; align-items:center; }
  .dialog h2 .x { margin-left:auto; cursor:pointer; color:var(--dim); font-size:20px; line-height:1; background:none; border:0; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  label { display:flex; flex-direction:column; font-size:11px; color:var(--dim); gap:5px; letter-spacing:.04em; }
  label.full { grid-column:1 / -1; }
  input, select { background:#0c1019; color:var(--txt); border:1px solid var(--line-2); border-radius:8px; padding:9px 11px; font:inherit; transition:.15s; }
  input:focus, select:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(91,140,255,.18); }
  .side-toggle { display:flex; gap:8px; }
  .side-toggle button { flex:1; padding:9px; border-radius:8px; border:1px solid var(--line-2); background:#0c1019; color:var(--dim); font:inherit; font-weight:600; cursor:pointer; }
  .side-toggle button.on[data-side="BUY"] { background:rgba(53,192,122,.15); color:var(--buy); border-color:var(--buy); }
  .side-toggle button.on[data-side="SELL"] { background:rgba(240,85,63,.15); color:var(--sell); border-color:var(--sell); }
  .actions { display:flex; align-items:center; gap:12px; margin-top:18px; }
  .actions .btn { padding:11px 22px; } .actions #msg { font-size:12px; color:var(--dim); }
  #msg.ok { color:var(--buy); } #msg.err { color:var(--sell); }
  .hint { font-size:11px; color:var(--dim); margin-top:2px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="bar">
    <span class="brand"><span class="dot"></span>JETHRO</span>
    <nav class="tabs">
      <a class="tab" href="/">Overview</a>
      <a class="tab" href="/markets.html">Markets</a>
      <a class="tab" href="/rates.html">Rates</a>
      <a class="tab" href="/books.html">Books</a>
      <a class="tab active" href="/orders.html">Orders</a>
      <a class="tab" href="/config.html">Config</a>
      <a class="tab" href="/sim.html">Sim</a>
      <a class="tab" href="/backtest.html">Backtest</a>
      <a class="tab" href="/ollama.html">Ops</a>
    </nav>
    <span class="spacer"></span>
    <button class="btn" id="open">+ New order</button>
  </div>
</div>
<main>
  <div class="section-h">Blotter <span class="muted" id="count"></span>
    <span class="muted" style="margin-left:auto;display:flex;gap:8px;align-items:center">
      <input type="date" id="obdate" style="background:#0c1019;color:var(--txt);border:1px solid var(--line-2);border-radius:7px;padding:5px 9px;font:inherit;font-size:12px">
      <button type="button" class="pgbtn" id="obprev">‹</button>
      <span id="obpage" style="font-size:12px"></span>
      <button type="button" class="pgbtn" id="obnext">›</button>
    </span></div>
  <div class="panel"><div id="blotter" class="muted" style="padding:16px">loading…</div></div>

  <div class="section-h" style="margin-top:18px">Execution quality (TCA)
    <span class="muted">slippage vs arrival price — positive bps = cost, negative = improvement; swaps in bp of rate (ADR-0025)</span></div>
  <div class="panel"><div id="tca" class="muted" style="padding:16px">loading…</div></div>
</main>

<div class="overlay" id="overlay">
  <div class="dialog">
    <h2>New order <button class="x" id="close">&times;</button></h2>
    <form id="f">
      <div class="grid">
        <label class="full">Instrument
          <select name="instrumentId" id="instrument"></select>
          <span class="hint" id="instrHint"></span>
        </label>
        <label class="full">Side
          <div class="side-toggle" id="side">
            <button type="button" data-side="BUY" class="on">Buy</button>
            <button type="button" data-side="SELL">Sell</button>
          </div>
        </label>
        <label>Book<select name="bookId" id="book"></select></label>
        <label>Type<select name="type" id="type"><option>MARKET</option><option>LIMIT</option></select></label>
        <label>TIF<select name="timeInForce" id="tif" title="GTC works until filled/cancelled; IOC cancels if not marketable on arrival; DAY expires at session close"><option>GTC</option><option>IOC</option><option>DAY</option></select></label>
        <label id="qtyLabel">Quantity<input name="quantity" id="quantity" value="100" inputmode="decimal"></label>
        <label id="limitLabel" style="display:none">Limit price<input name="limitPrice" id="limitPrice" inputmode="decimal" placeholder="(market)"></label>
      </div>
      <div class="actions">
        <button type="submit" class="btn" id="submit">Submit order</button>
        <span id="msg"></span>
      </div>
    </form>
  </div>
</div>

<script>
  const esc = s => { const d=document.createElement("span"); d.textContent=s??""; return d.innerHTML; };
  const t = ms => new Date(ms).toLocaleTimeString();
  const QTY_LABEL = { EQUITY:"Shares", FUTURE:"Contracts", FX:"Notional", BOND:"Contracts", SWAP:"Lots ($1M · BUY = pay fixed)", OPTION:"Contracts" };
  let instrClass = {}, cusipOf = {};
  const primaryId = sym => (sym && (sym.CUSIP || sym.ISIN || sym.GLOBEX || sym.ISO)) || null;

  // ---- modal ----
  const overlay = document.getElementById("overlay");
  const openModal = () => { overlay.classList.add("open"); document.getElementById("quantity").focus(); };
  const closeModal = () => { overlay.classList.remove("open"); document.getElementById("msg").textContent=""; };
  document.getElementById("open").onclick = openModal;
  document.getElementById("close").onclick = closeModal;
  overlay.onclick = e => { if (e.target === overlay) closeModal(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

  // side toggle
  let side = "BUY";
  document.querySelectorAll("#side button").forEach(b => b.onclick = () => {
    side = b.dataset.side;
    document.querySelectorAll("#side button").forEach(x => x.classList.toggle("on", x.dataset.side===side));
  });

  // instrument-type-aware inputs
  function syncInputs() {
    const instr = document.getElementById("instrument").value;
    const ac = instrClass[instr] || "EQUITY";
    document.querySelector("#qtyLabel").childNodes[0].nodeValue = QTY_LABEL[ac] || "Quantity";
    document.getElementById("instrHint").textContent = ac ? (ac + " · priced from live marks") : "";
    const isLimit = document.getElementById("type").value === "LIMIT";
    document.getElementById("limitLabel").style.display = isLimit ? "" : "none";
  }
  document.getElementById("type").onchange = syncInputs;
  document.getElementById("instrument").onchange = syncInputs;

  // ---- populate dropdowns ----
  function flatten(nodes, out) { nodes.forEach(n => { out.push(n); if (n.children) flatten(n.children, out); }); return out; }
  async function populate() {
    try {
      const instruments = await (await fetch("/api/instruments")).json();
      instruments.forEach(i => { instrClass[i.instrumentId] = i.assetClass; cusipOf[i.instrumentId] = primaryId(i.symbology); });
      // Swaps are orderable since V9: quoted as a live par rate (%), 1 lot = $1M
      // notional, BUY = pay fixed. They fill at the par mark like any instrument.
      document.getElementById("instrument").innerHTML = instruments.map(i =>
        `<option value="${esc(i.instrumentId)}">${esc(i.instrumentId)} — ${esc(i.assetClass)}</option>`).join("");
      const books = flatten(await (await fetch("/api/books")).json(), []);
      document.getElementById("book").innerHTML = books.map(b =>
        `<option value="${esc(b.bookId)}"${b.bookId==='ALPHA'?' selected':''}>${esc(b.name)} (${esc(b.bookId)})</option>`).join("");
      syncInputs();
    } catch (e) {}
  }

  // ---- submit ----
  document.getElementById("f").addEventListener("submit", async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());
    data.side = side;
    const msg = document.getElementById("msg");
    try {
      const res = await fetch("/api/orders", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)});
      const o = await res.json();
      if (res.ok) { msg.className="ok"; msg.textContent = `${o.side} ${o.quantity} ${o.instrumentId} · ${o.bookId} → ${o.status}`; setTimeout(closeModal, 900); }
      else { msg.className="err"; msg.textContent = "rejected: " + (o.error || JSON.stringify(o)); }
    } catch (err) { msg.className="err"; msg.textContent = "error: " + err; }
    refresh();
  });

  // ---- blotter (single table; fill is the order's outcome, not a second table) ----
  let obPage = 0, obTotalPages = 1;
  const today = () => new Date().toLocaleDateString("sv-SE"); // YYYY-MM-DD local
  async function refresh() {
    let page = null, fills = [];
    const date = document.getElementById("obdate").value || today();
    try {
      page = await (await fetch(`/api/orders/day?date=${date}&page=${obPage}&size=100`)).json();
      fills = await (await fetch("/api/fills")).json();
    } catch (e) { return; }
    const orders = page.orders;
    obTotalPages = page.totalPages;
    document.getElementById("obpage").textContent = `page ${page.page + 1}/${page.totalPages}`;
    const fillByOrder = {};
    fills.forEach(f => fillByOrder[f.orderId] = f); // best-effort: recent fills only
    document.getElementById("count").textContent = page.total + " orders on " + date;
    document.getElementById("blotter").outerHTML = '<div id="blotter">' + (orders.length ?
      "<table><tr><th>time</th><th>order id</th><th>instr</th><th>CUSIP / ID</th><th>book</th><th>side</th><th>type</th><th>TIF</th><th>qty</th><th>limit</th><th>status</th><th>fill</th><th>fill id</th></tr>" +
      orders.map(o => { const f = fillByOrder[o.orderId]; const working = o.status === 'ROUTED';
        return `<tr>
        <td class="muted mono">${t(o.createdAtMillis)}</td>
        <td class="mono idcell" title="click to copy" onclick="copyId(this)">${esc(o.orderId)}</td>
        <td>${esc(o.instrumentId)}</td><td class="muted mono">${esc(cusipOf[o.instrumentId]||'—')}</td><td class="muted">${esc(o.bookId)}</td>
        <td class="${esc(o.side)}">${esc(o.side)}</td><td class="muted">${esc(o.orderType)}</td>
        <td class="muted">${esc(o.timeInForce||'GTC')}</td>
        <td class="mono">${esc(o.quantity)}</td><td class="mono muted">${esc(o.limitPrice||"—")}</td>
        <td><span class="st ${esc(o.status)}" title="${esc(o.reason||'')}">${working?'WORKING':esc(o.status)}</span>${(o.status==='REJECTED'||o.status==='CANCELLED')&&o.reason?`<div class="muted" style="font-size:10px">${esc(o.reason)}</div>`:''}</td>
        <td class="mono">${f ? esc(f.price) : (working
            ? `<button type="button" class="pgbtn" style="font-size:11px;padding:2px 8px" onclick="cancelOrder('${esc(o.orderId)}')">cancel</button>`
            : '<span class="muted">—</span>')}</td>
        <td class="mono muted idcell" ${f ? `title="click to copy" onclick="copyId(this)"` : ''}>${f ? esc(f.fillId) : '—'}</td></tr>`; }).join("") + "</table>"
      : '<div class="muted" style="padding:16px">no orders on this date</div>') + '</div>';
  }
  // Cancel a working order (ADR-0025); the blotter refreshes with the outcome (a fill that
  // won the race shows FILLED — you cannot cancel what already executed).
  // Click an id cell to copy the full identifier (order id / fill id) — the value shown is
  // the full id (ellipsis is display only), so it also stays Ctrl+F searchable.
  window.copyId = el => {
    const id = el.textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(id).catch(() => {});
    el.classList.add("copied");
    setTimeout(() => el.classList.remove("copied"), 900);
  };
  window.cancelOrder = async id => {
    try { await fetch(`/api/orders/${id}/cancel`, {method:"POST"}); } catch (e) {}
    refresh();
  };
  document.getElementById("obdate").value = today();
  document.getElementById("obdate").onchange = () => { obPage = 0; refresh(); };
  document.getElementById("obprev").onclick = () => { if (obPage > 0) { obPage--; refresh(); } };
  document.getElementById("obnext").onclick = () => { if (obPage < obTotalPages - 1) { obPage++; refresh(); } };

  // TCA panel: per-instrument aggregates (avg/worst slippage vs arrival) + fill count.
  async function loadTca() {
    try {
      const t = await fetch("/api/tca").then(r => r.json());
      const rows = t.byInstrument || [];
      document.getElementById("tca").outerHTML = '<div id="tca">' + (rows.length
        ? "<table><tr><th>instrument</th><th>fills</th><th>avg slippage</th><th>worst</th><th>unit</th></tr>"
          + rows.map(a => {
              const avg = Number(a.avgSlippageBps), worst = Number(a.worstSlippageBps);
              const c = v => v > 0.01 ? "down" : (v < -0.01 ? "up" : "muted");
              return `<tr><td>${esc(a.instrument)}</td><td class="muted mono">${a.fills}</td>
                <td class="mono ${c(avg)}">${avg.toFixed(2)}</td>
                <td class="mono ${c(worst)}">${worst.toFixed(2)}</td>
                <td class="muted">${a.rateQuoted ? "bp of rate" : "bps of price"}</td></tr>`;
            }).join("") + "</table>"
        : '<div class="muted" style="padding:16px">no fills measured yet — TCA rows appear as orders execute</div>') + '</div>';
    } catch (e) {}
  }

  populate();
  refresh();
  loadTca();
  setInterval(refresh, 2500);
  setInterval(loadTca, 10000);
</script>
</body>
</html>
