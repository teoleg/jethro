<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jethro — orders</title>
<style>
  :root { --bg:#0e1116; --card:#161b23; --line:#232a35; --txt:#d7dde6; --dim:#8a94a3;
          --buy:#3d9a5a; --sell:#d94f3d; --fill:#3d7bd9; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--txt); font:14px/1.5 system-ui, sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; }
  header h1 { font-size:16px; letter-spacing:.08em; }
  header a { color:var(--dim); font-size:12px; text-decoration:none; }
  main { max-width:1000px; margin:0 auto; padding:20px; display:grid; gap:20px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:14px 16px; }
  h2 { font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:.1em; margin-bottom:10px; }
  form { display:flex; gap:8px; flex-wrap:wrap; align-items:end; }
  label { display:flex; flex-direction:column; font-size:11px; color:var(--dim); gap:3px; }
  input, select { background:#0e1116; color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:6px 8px; font:inherit; }
  button { background:var(--fill); color:#fff; border:0; border-radius:4px; padding:8px 16px; font:inherit; cursor:pointer; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  th { color:var(--dim); font-weight:normal; font-size:11px; text-transform:uppercase; }
  .BUY { color:var(--buy); } .SELL { color:var(--sell); }
  .status { font-size:11px; padding:1px 6px; border-radius:3px; border:1px solid var(--line); }
  .FILLED { color:var(--buy); border-color:var(--buy); }
  .REJECTED { color:var(--sell); border-color:var(--sell); }
  .ROUTED, .NEW { color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>JETHRO</h1><a href="/">← attention feed</a><a href="/books.html">books</a>
  <span style="color:var(--dim);font-size:12px">order view — submit &amp; blotter (simulated execution)</span>
</header>
<main>
  <section class="panel">
    <h2>New order</h2>
    <form id="f">
      <label>Book<select name="bookId"><option>ALPHA</option><option>BETA</option><option>FIRM</option></select></label>
      <label>Instrument<select name="instrumentId"><option>AAPL</option><option>MSFT</option><option>AMZN</option><option>GOOG</option></select></label>
      <label>Side<select name="side"><option>BUY</option><option>SELL</option></select></label>
      <label>Type<select name="type"><option>MARKET</option><option>LIMIT</option></select></label>
      <label>Qty<input name="quantity" value="100" size="6"></label>
      <label>Limit<input name="limitPrice" placeholder="(market)" size="8"></label>
      <button type="submit">Submit</button>
    </form>
    <div id="msg" style="color:var(--dim);font-size:12px;margin-top:8px"></div>
  </section>
  <section class="panel">
    <h2>Orders</h2>
    <div id="orders" style="color:var(--dim)">loading…</div>
  </section>
  <section class="panel">
    <h2>Fills</h2>
    <div id="fills" style="color:var(--dim)">loading…</div>
  </section>
</main>
<script>
  const esc = s => { const d=document.createElement("span"); d.textContent=s??""; return d.innerHTML; };
  const t = ms => new Date(ms).toLocaleTimeString();

  async function refresh() {
    const orders = await (await fetch("/api/orders")).json();
    document.getElementById("orders").innerHTML = orders.length ?
      "<table><tr><th>time</th><th>book</th><th>instr</th><th>side</th><th>type</th><th>qty</th><th>limit</th><th>status</th></tr>" +
      orders.map(o => `<tr><td>${t(o.createdAtMillis)}</td><td>${esc(o.bookId)}</td><td>${esc(o.instrumentId)}</td>
        <td class="${esc(o.side)}">${esc(o.side)}</td><td>${esc(o.orderType)}</td><td>${esc(o.quantity)}</td>
        <td>${esc(o.limitPrice||"—")}</td><td><span class="status ${esc(o.status)}">${esc(o.status)}</span></td></tr>`).join("") + "</table>"
      : "no orders yet — submit one above";
    const fills = await (await fetch("/api/fills")).json();
    document.getElementById("fills").innerHTML = fills.length ?
      "<table><tr><th>time</th><th>instr</th><th>side</th><th>qty</th><th>price</th></tr>" +
      fills.map(f => `<tr><td>${t(f.executedAtMillis)}</td><td>${esc(f.instrumentId)}</td>
        <td class="${esc(f.side)}">${esc(f.side)}</td><td>${esc(f.quantity)}</td><td>${esc(f.price)}</td></tr>`).join("") + "</table>"
      : "no fills yet";
  }

  document.getElementById("f").addEventListener("submit", async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());
    const msg = document.getElementById("msg");
    try {
      const res = await fetch("/api/orders", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)});
      const o = await res.json();
      msg.textContent = res.ok ? `submitted ${o.orderId} → ${o.status}` : "error: " + JSON.stringify(o);
    } catch (err) { msg.textContent = "error: " + err; }
    refresh();
  });

  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
