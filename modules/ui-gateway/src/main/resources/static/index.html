<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jethro — attention</title>
<style>
  /* v0 placeholder page (ADR-0017); replaced by the React app under ui/ as views grow */
  :root { --bg:#0e1116; --card:#161b23; --line:#232a35; --txt:#d7dde6; --dim:#8a94a3;
          --info:#3d7bd9; --warn:#d9a13d; --alert:#d94f3d; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--txt); font:14px/1.5 system-ui, sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; }
  header h1 { font-size:16px; letter-spacing:.08em; }
  header .sub { color:var(--dim); font-size:12px; }
  #marks { display:flex; gap:10px; padding:10px 20px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  .mark { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:6px 12px; }
  .mark b { font-variant-numeric:tabular-nums; }
  .mark .age { color:var(--dim); font-size:11px; margin-left:6px; }
  .mark.stale { border-color:var(--warn); }
  main { max-width:860px; margin:0 auto; padding:20px; }
  .empty { color:var(--dim); text-align:center; padding:40px 0; }
  .card { background:var(--card); border:1px solid var(--line); border-left:3px solid var(--info);
          border-radius:6px; padding:12px 16px; margin-bottom:10px; }
  .card.WARN { border-left-color:var(--warn); }
  .card.ALERT { border-left-color:var(--alert); }
  .card h3 { font-size:13px; margin-bottom:4px; }
  .card .meta { color:var(--dim); font-size:11px; margin-top:6px; }
  .card p { color:var(--txt); font-size:13px; white-space:pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>JETHRO</h1>
  <span class="sub">attention feed — deterministic triggers always surface; agents annotate (ADR-0017)</span>
  <a class="sub" href="/books.html" style="color:inherit">books</a>
  <span class="sub" id="status">connecting…</span>
</header>
<div id="marks"></div>
<main>
  <div id="feed"><div class="empty">all quiet — nothing needs you</div></div>
</main>
<script>
  const fmtAge = ms => ms < 2000 ? "live" : Math.round(ms / 1000) + "s";
  const esc = s => { const d = document.createElement("span"); d.textContent = s ?? ""; return d.innerHTML; };

  function renderMarks(marks) {
    document.getElementById("marks").innerHTML = marks.map(m =>
      `<span class="mark ${m.ageMillis > 10000 ? "stale" : ""}">${esc(m.instrumentId)}
         <b>${esc(m.price)}</b><span class="age">${fmtAge(m.ageMillis)}</span></span>`).join("");
  }

  function renderFeed(items) {
    const feed = document.getElementById("feed");
    if (!items.length) { feed.innerHTML = '<div class="empty">all quiet — nothing needs you</div>'; return; }
    feed.innerHTML = items.map(i =>
      `<div class="card ${esc(i.severity)}">
         <h3>${esc(i.title)}</h3>
         <p>${esc(i.body)}</p>
         <div class="meta">${esc(i.kind)} · ${new Date(i.timestampMillis).toLocaleTimeString()} · evidence: ${esc(i.evidenceRef)}</div>
       </div>`).join("");
  }

  async function bootstrap() {
    renderMarks(await (await fetch("/api/marks")).json());
    renderFeed(await (await fetch("/api/attention")).json());
  }

  const es = new EventSource("/api/stream");
  es.onopen = () => document.getElementById("status").textContent = "live";
  es.onerror = () => document.getElementById("status").textContent = "reconnecting…";
  es.addEventListener("marks", e => renderMarks(JSON.parse(e.data)));
  es.addEventListener("attention", e => renderFeed(JSON.parse(e.data)));
  bootstrap();
</script>
</body>
</html>
