<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jethro — sim console</title>
<style>
  :root{ --bg:#0a0d13; --surface:#141926; --surface-2:#1a2030; --line:#252d3d; --line-2:#323c50;
    --txt:#e6eaf2; --dim:#8b95a8; --brand:#5b8cff; --up:#35c07a; --down:#f0553f; --warn:#e0a83d; --teal:#48d3c4; }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
  .mono{font-variant-numeric:tabular-nums;font-family:"SF Mono",ui-monospace,Menlo,monospace}
  .topbar{position:sticky;top:0;z-index:10;backdrop-filter:blur(10px);background:rgba(10,13,19,.72);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:18px;padding:0 22px;height:54px;max-width:1500px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.2em;font-size:14px}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal)}
  .nav{display:flex;gap:3px} .nav a{padding:7px 12px;border-radius:8px;color:var(--dim);text-decoration:none;font-size:12.5px}
  .nav a:hover{color:var(--txt);background:var(--surface)} .nav a.active{color:var(--txt);background:var(--surface-2)}
  .spacer{flex:1} .badge{font-size:10px;padding:2px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--dim)}
  .badge.live{color:var(--warn);border-color:var(--warn)} .badge.clean{color:var(--up);border-color:var(--up)}
  main{max-width:1500px;margin:0 auto;padding:16px 22px 40px}

  /* global control bar */
  .globals{display:flex;flex-wrap:wrap;align-items:center;gap:18px;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:12px 16px;margin-bottom:16px}
  .gctl{display:flex;flex-direction:column;gap:4px;min-width:150px}
  .gctl .lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
  .gctl .lbl b{color:var(--txt);font-variant-numeric:tabular-nums}
  select,button{background:var(--surface-2);border:1px solid var(--line-2);color:var(--txt);border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--brand)} button.warn{border-color:var(--warn);color:var(--warn)} button.on{background:rgba(224,168,61,.16)}

  /* tabs */
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px}
  .tabgroup{display:flex;align-items:center;gap:6px}
  .tabgroup .glabel{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 2px 0 8px}
  .tab{padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--dim);
    font-size:13px;font-weight:600;cursor:pointer}
  .tab:hover{color:var(--txt)} .tab.active{color:#fff;background:var(--surface-2);border-color:var(--brand)}
  .tab.charts.active{border-color:var(--teal)}

  /* instrument panel */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
  .ihead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .iname{font-size:20px;font-weight:700} .iid{color:var(--dim);font-size:12px} .icls{font-size:10px;padding:2px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  .price{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;margin:6px 0} .price .chg{font-size:15px;margin-left:10px}
  .up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)}
  .meterbar{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line);margin:8px 0 22px}
  .meterbar > i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--up),var(--warn) 70%,var(--down));transition:width .15s}

  .sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px 40px}
  .sl{display:flex;flex-direction:column;gap:8px}
  .sl .row{display:flex;justify-content:space-between;align-items:baseline}
  .sl .name{font-size:13px;font-weight:600} .sl .val{font-variant-numeric:tabular-nums;color:var(--teal);font-family:"SF Mono",ui-monospace,monospace;font-size:13px}
  .sl .hint{font-size:11px;color:var(--dim)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line-2);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:6px;cursor:grab;
    background:linear-gradient(180deg,#3a4150,#232833);border:1px solid #4a5568;box-shadow:0 2px 5px rgba(0,0,0,.5)}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:6px;cursor:grab;background:#333a48;border:1px solid #4a5568}
  input[type=range]:active::-webkit-slider-thumb{cursor:grabbing;border-color:var(--brand)}
  .btnrow{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
  .btnrow button{padding:9px 16px} .btnrow .zap{color:var(--warn);border-color:var(--warn)}
  .btnrow .mute.on{background:rgba(240,85,63,.16);border-color:var(--down);color:var(--down)}

  /* charts tab */
  .rangebar{display:flex;gap:6px;align-items:center;margin-bottom:16px}
  .rangebar .lbl{font-size:11px;color:var(--dim);margin-right:4px}
  .rangebar button{padding:5px 12px;border-radius:999px;font-size:12px}
  .rangebar button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .card h4{font-size:13px;margin-bottom:2px;display:flex;justify-content:space-between;align-items:baseline}
  .card h4 .c{font-size:12px;font-weight:400}
  .card svg{width:100%;height:120px;display:block} .card svg .line{fill:none;stroke:var(--brand);stroke-width:1.6}
  .card svg .area{fill:rgba(91,140,255,.10);stroke:none} .card .empty{color:var(--dim);font-size:11px;padding:38px 0;text-align:center}

  /* events */
  .events{margin-top:16px} .events h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
  .ev{display:flex;gap:12px;align-items:baseline;padding:6px 2px;border-bottom:1px solid var(--line);font-size:13px}
  .ev:last-child{border:0} .ev .t{color:var(--dim);font-family:"SF Mono",ui-monospace,monospace;font-size:12px;white-space:nowrap}
  .ev .pill{font-size:9px;padding:1px 7px;border-radius:999px;font-weight:700}
  .pill.price{background:rgba(91,140,255,.16);color:var(--brand)} .pill.volume{background:rgba(224,168,61,.16);color:var(--warn)} .pill.news{background:rgba(53,192,122,.14);color:var(--up)}
  .notice{padding:48px 20px;text-align:center;color:var(--dim)} .notice h2{color:var(--txt);font-size:16px;margin-bottom:8px}
  .help{color:var(--dim);font-size:12px;margin:2px 2px 14px}
</style>
</head>
<body>
<div class="topbar"><div class="bar">
  <span class="brand"><span class="dot"></span>JETHRO</span>
  <nav class="nav">
    <a href="/">Overview</a><a href="/markets.html">Markets</a><a href="/books.html">Books</a>
    <a href="/orders.html">Orders</a><a class="active" href="/sim.html">Sim</a><a href="/ollama.html">Ops</a>
  </nav>
  <span class="spacer"></span><span id="statusBadge" class="badge">loading…</span>
</div></div>
<main>
  <div id="stage"><div class="notice">connecting to the sim…</div></div>
</main>
<script src="/chart.js"></script>
<script>
(() => {
  const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
  const esc=s=>{const d=document.createElement("span");d.textContent=s??"";return d.innerHTML;};
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  async function post(u,b){const r=await fetch(u,{method:"POST",headers:{"content-type":"application/json"},body:b==null?null:JSON.stringify(b)});if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}
  const enc=encodeURIComponent;

  // value mappings ↔ SimControl dials
  const volToF=v=>clamp(v,0,3),        fToVol=f=>+(+f).toFixed(2);          // bp-range = vol multiplier
  const drToF=d=>clamp(d/0.006,-1,1),  fToDr=f=>+(f*0.006).toFixed(5);      // drift bias
  const qToF =v=>clamp(v,0,3),         fToQ=f=>+(+f).toFixed(2);            // volume scale
  const spToF=s=>clamp(Math.log(s/0.1)/Math.log(200),0,1), fToSp=f=>+(0.1*Math.pow(200,f)).toFixed(2);

  let state=null, instrClass={}, current=null, view="inst", chartMinutes=15, chartTimer=null;

  // ---- slider widget (a moving handle, not a knob) ----
  function slider({name,hint,min,max,step,value,fmt,onCommit}){
    const wrap=$("div","sl");
    const row=$("div","row"); const nm=$("div","name",name); const val=$("div","val");
    row.append(nm,val); wrap.append(row);
    const inp=document.createElement("input"); inp.type="range"; inp.min=min; inp.max=max; inp.step=step; inp.value=value;
    wrap.append(inp);
    if(hint) wrap.append($("div","hint",hint));
    const show=()=>val.textContent=fmt(+inp.value);
    inp.addEventListener("input",show);
    inp.addEventListener("change",()=>onCommit(+inp.value));
    show();
    return {el:wrap, set:v=>{inp.value=v;show();}};
  }

  // ---- build ----
  function build(){
    const stage=document.getElementById("stage");
    stage.innerHTML="";
    stage.append(globalBar(), tabBar(), $("div","",'<div id="content"></div>'));
    if(!current && state.instruments.length) current=state.instruments[0].id;
    renderView();
  }

  function globalBar(){
    const g=$("div","globals");
    // publish frequency (global speed)
    const spd=slider({name:"Publish rate", hint:"how often the sim emits ticks (× speed)", min:0,max:1,step:0.01,
      value:spToF(state.speedMultiplier), fmt:f=>"× "+fToSp(f), onCommit:f=>post("/api/sim/control/speed",{multiplier:fToSp(f)}).then(s=>state=s)});
    spd.el.style.minWidth="240px";
    const regime=$("div","gctl");
    const sel=$("select"); const auto=$("option",null,"AUTO");auto.value="AUTO";sel.append(auto);
    (state.regimes||[]).forEach(r=>{const o=$("option",null,r);o.value=r;sel.append(o);});
    sel.value=state.regimeOverride||"AUTO"; sel.onchange=()=>post("/api/sim/control/regime",{regime:sel.value}).then(s=>state=s);
    regime.append($("div","lbl","Regime"),sel);
    const btns=$("div","gctl");
    const brow=$("div"); brow.style.display="flex"; brow.style.gap="8px";
    const pause=$("button",state.paused?"warn on":"", state.paused?"▶ Resume":"⏸ Pause");
    pause.onclick=()=>post("/api/sim/control/pause",{paused:!state.paused}).then(s=>{state=s;build();});
    const reseed=$("button",null,"↻ Reseed"); reseed.onclick=()=>post("/api/sim/control/reseed",{}).then(s=>state=s);
    const reset=$("button","warn","Reset dials"); reset.onclick=()=>post("/api/sim/control/reset",{}).then(s=>{state=s;build();});
    brow.append(pause,reseed,reset);
    btns.append($("div","lbl","Session"),brow);
    g.append(spd.el,regime,btns);
    return g;
  }

  function tabBar(){
    const bar=$("div","tabs");
    // group instruments by asset class (same breakdown as Markets)
    const groups={};
    state.instruments.forEach(it=>{const c=instrClass[it.id]||"OTHER";(groups[c]=groups[c]||[]).push(it);});
    Object.keys(groups).sort().forEach(cls=>{
      const grp=$("div","tabgroup"); grp.append($("span","glabel",cls));
      groups[cls].forEach(it=>{
        const t=$("button","tab"+(view==="inst"&&current===it.id?" active":""), esc(it.name||it.id));
        t.onclick=()=>{view="inst";current=it.id;renderView();};
        grp.append(t);
      });
      bar.append(grp);
    });
    const ct=$("button","tab charts"+(view==="charts"?" active":""),"📈 Charts");
    ct.onclick=()=>{view="charts";renderView();};
    bar.append(ct);
    return bar;
  }

  function renderView(){
    const old=document.querySelector(".tabs"); if(old) old.replaceWith(tabBar()); // refresh active state
    const c=document.getElementById("content");
    if(chartTimer){clearInterval(chartTimer);chartTimer=null;}
    if(view==="charts"){ c.innerHTML=""; c.append(chartsPanel()); return; }
    activePanel=null; c.innerHTML=""; c.append(instrPanel(state.instruments.find(i=>i.id===current)));
  }

  // ---- one instrument ----
  function instrPanel(it){
    if(!it) return $("div","notice","pick an instrument");
    const p=$("div","panel");
    const head=$("div","ihead");
    head.append($("div","iname",esc(it.name||it.id)), $("div","iid mono",esc(it.id)), $("div","icls",esc(instrClass[it.id]||"—")));
    const price=$("div","price mono","—"); const chg=$("span","chg mono",""); price.append(chg);
    const meter=$("div","meterbar"); const mfill=$("i"); meter.append(mfill);
    p.append(head,price,meter);

    const sliders=$("div","sliders");
    const sBp=slider({name:"BP range (move size)", hint:"idiosyncratic volatility × — bigger = wider bp swings per tick",
      min:0,max:3,step:0.05,value:volToF(it.volMultiplier),fmt:f=>"× "+f.toFixed(2),
      onCommit:f=>post(`/api/sim/instrument/${enc(it.id)}/vol`,{value:fToVol(f)}).then(()=>it.volMultiplier=fToVol(f))});
    const sDr=slider({name:"Drift (trend)", hint:"per-tick directional bias — left = down, right = up",
      min:-1,max:1,step:0.02,value:drToF(it.driftBias),fmt:f=>(f>=0?"+":"")+(f*0.6).toFixed(2)+"bp/tick",
      onCommit:f=>post(`/api/sim/instrument/${enc(it.id)}/drift`,{value:fToDr(f)}).then(()=>it.driftBias=fToDr(f))});
    const sQ=slider({name:"Volume", hint:"traded size × (drives ADV + participation)",
      min:0,max:3,step:0.05,value:qToF(it.volumeScale),fmt:f=>"× "+f.toFixed(2),
      onCommit:f=>post(`/api/sim/instrument/${enc(it.id)}/volume`,{value:fToQ(f)})});
    sliders.append(sBp.el,sDr.el,sQ.el);
    p.append(sliders);

    const row=$("div","btnrow");
    const dn=$("button",null,"− nudge"); dn.onclick=()=>post(`/api/sim/instrument/${enc(it.id)}/nudge`,{value:-0.004});
    const up=$("button",null,"+ nudge"); up.onclick=()=>post(`/api/sim/instrument/${enc(it.id)}/nudge`,{value:0.004});
    const zap=$("button","zap","⚡ news shock"); zap.onclick=()=>post("/api/sim/news",{instrumentId:it.id,direction:it.driftBias>=0?"BULL":"BEAR",magnitude:0.015}).catch(()=>{});
    const mute=$("button","mute","Mute");
    mute.onclick=()=>{const on=!mute.classList.contains("on");mute.classList.toggle("on",on);
      const v=on?0:(it.prevVol||1); if(on)it.prevVol=it.volMultiplier; it.volMultiplier=v; sBp.set(volToF(v));
      post(`/api/sim/instrument/${enc(it.id)}/vol`,{value:v});};
    row.append(dn,zap,up,mute);
    const chartBtn=$("button",null,"📈 price history"); chartBtn.onclick=()=>window.openChart&&window.openChart(it.id);
    row.append(chartBtn);
    p.append(row);

    p._price=price; p._chg=chg; p._mfill=mfill; p._id=it.id;
    activePanel=p;
    return p;
  }

  // ---- charts tab: all ticks, small multiples, time range ----
  const RANGES=[["1m",1],["5m",5],["15m",15],["1h",60],["6h",360],["12h",720]];
  function chartsPanel(){
    const wrap=$("div");
    const rb=$("div","rangebar"); rb.append($("span","lbl","Window:"));
    RANGES.forEach(([label,mins])=>{const b=$("button",chartMinutes===mins?"on":"",label);
      b.onclick=()=>{chartMinutes=mins;renderView();}; rb.append(b);});
    wrap.append(rb);
    const grid=$("div","grid"); grid.id="chartGrid"; wrap.append(grid);
    state.instruments.forEach(it=>{
      const card=$("div","card"); card.dataset.id=it.id;
      card.append($("h4","",`<span>${esc(it.name||it.id)}</span><span class="c muted mono" data-c></span>`),
                  $("div","plot",'<div class="empty">loading…</div>'));
      grid.append(card);
    });
    const ev=$("div","events"); ev.innerHTML='<h4>Recent events</h4><div id="evlist" class="muted">—</div>'; wrap.append(ev);
    // first load AFTER renderView appends this panel to the document (else #chartGrid isn't found yet)
    setTimeout(()=>{loadCharts();loadEvents();},0);
    chartTimer=setInterval(()=>{loadCharts();loadEvents();},4000);
    return wrap;
  }
  async function loadCharts(){
    const grid=document.getElementById("chartGrid"); if(!grid)return;
    await Promise.all([...grid.children].map(async card=>{
      try{
        const pts=await (await fetch(`/api/history/${enc(card.dataset.id)}?minutes=${chartMinutes}`)).json();
        const plot=card.querySelector(".plot"); const cEl=card.querySelector("[data-c]");
        plot.innerHTML=miniSvg(pts);
        if(pts.length>1){const f=+pts[0].price,l=+pts[pts.length-1].price,ch=(l-f)/f*100;
          cEl.textContent=(ch>=0?"+":"")+ch.toFixed(2)+"%"; cEl.className="c mono "+(ch>=0?"up":"down");}
        else cEl.textContent="";
      }catch(e){}
    }));
  }
  function miniSvg(points){
    if(!points||points.length<2) return '<div class="empty">not enough ticks yet in this window</div>';
    const W=340,H=120,pl=6,pr=6,pt=8,pb=8;
    const t0=points[0].t,t1=points[points.length-1].t||(t0+1);
    const ys=points.map(p=>+p.price),mn=Math.min(...ys),mx=Math.max(...ys),span=(mx-mn)||1;
    const X=t=>pl+(t1===t0?0:(t-t0)/(t1-t0))*(W-pl-pr);
    const Y=v=>H-pb-((v-mn)/span)*(H-pt-pb);
    const line=points.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(+p.price).toFixed(1)}`).join(" ");
    const area=`M${X(t0).toFixed(1)},${H-pb} `+points.map(p=>`L${X(p.t).toFixed(1)},${Y(+p.price).toFixed(1)}`).join(" ")+` L${X(t1).toFixed(1)},${H-pb} Z`;
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path class="area" d="${area}"/><path class="line" d="${line}"/></svg>`;
  }
  async function loadEvents(){
    try{ const s=await (await fetch("/api/sim/spikes")).json(); const el=document.getElementById("evlist"); if(!el)return;
      if(!s.length){el.className="muted";el.textContent="no spikes yet — nudge a market or fire ⚡";return;}
      el.className=""; el.innerHTML=s.slice(0,20).map(e=>{
        const t=new Date(e.atMillis).toLocaleTimeString([],{hour12:false});
        return `<div class="ev"><span class="t">${t}</span><span class="pill ${e.type.toLowerCase()}">${esc(e.type)}</span><b>${esc(e.name||e.instrumentId)}</b><span class="muted">${esc(e.detail)}</span></div>`;
      }).join("");
    }catch(e){}
  }

  // ---- live price + meter for the active instrument panel ----
  let activePanel=null, lastMid={};
  async function loadLive(){
    if(view!=="inst"||!activePanel)return;
    try{
      const depth=await (await fetch("/api/depth")).json();
      const d=depth.find(x=>x.instrumentId===activePanel._id); if(!d)return;
      const mid=(+d.bid + +d.ask)/2;
      const prev=lastMid[activePanel._id]; lastMid[activePanel._id]=mid;
      activePanel._price.firstChild.nodeValue=(mid>=1000?mid.toFixed(1):mid>=100?mid.toFixed(2):mid.toFixed(4))+" ";
      if(prev){const bps=(mid/prev-1)*10000;
        activePanel._chg.textContent=(bps>=0?"+":"")+bps.toFixed(0)+"bp";
        activePanel._chg.className="chg mono "+(bps>0.5?"up":bps<-0.5?"down":"");
        const act=clamp(Math.abs(bps)/60,0,1); activePanel._mfill.style.width=(act*100).toFixed(0)+"%";}
    }catch(e){}
  }

  async function boot(){
    const badge=document.getElementById("statusBadge");
    try{
      const r=await fetch("/api/sim/control");
      if(r.status===403){badge.textContent="idle";badge.className="badge clean";
        document.getElementById("stage").innerHTML='<div class="notice"><h2>The console is live only in SIM feed mode</h2><div>Boot with <span class="mono">jethro.trading.provider=sim</span> and the correlated engine.</div></div>';return;}
      state=await r.json();
      badge.textContent=state.active?"panel-driven":"seeded · untouched";badge.className="badge "+(state.active?"live":"clean");
      try{ (await (await fetch("/api/instruments")).json()).forEach(i=>instrClass[i.instrumentId]=i.assetClass); }catch(e){}
      build();
      loadLive(); setInterval(loadLive,1500);
      setInterval(async()=>{try{const s=await(await fetch("/api/sim/control")).json();
        if(s.active!==state.active){state.active=s.active;badge.textContent=s.active?"panel-driven":"seeded · untouched";badge.className="badge "+(s.active?"live":"clean");}
      }catch(e){}},4000);
    }catch(e){document.getElementById("stage").innerHTML='<div class="notice">sim console unavailable</div>';}
  }
  boot();
})();
</script>
</body>
</html>
